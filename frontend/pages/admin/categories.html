<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.cats_page_title">Quản lý danh mục | Admin Substack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 w-full">
        <!-- Sidebar Admin -->
        <aside id="adminSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-6xl w-full space-y-6">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderDark pb-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                        <i class="fa-solid fa-layer-group text-substackOrange"></i>
                        <span data-i18n="admin.cats_heading">Quản lý danh mục bài viết</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-1" data-i18n="admin.cats_heading_desc">Phân loại chuyên mục giúp độc giả dễ dàng khám phá bài viết theo lĩnh vực.</p>
                </div>

                <div class="flex items-center space-x-2.5">
                    <button onclick="openCategoryModal('create')" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span data-i18n="admin.cats_add_title">Thêm danh mục mới</span>
                    </button>
                </div>
            </div>

            <!-- Thanh tìm kiếm & Bộ lọc -->
            <form id="categoryFilterForm" novalidate class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-sidebarBg p-3.5 rounded-2xl border border-borderDark text-xs">
                <div class="sm:col-span-2 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500"></i>
                    <input type="text" id="catSearchInput" name="catSearch" placeholder="Tìm kiếm theo tên danh mục, đường dẫn (slug) hoặc mô tả..." data-i18n-placeholder="admin.cats_search_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl pl-9 pr-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-substackOrange">
                </div>
                <div>
                    <select id="catStatusFilter" name="catStatus" class="w-full bg-darkBg border border-borderDark rounded-xl px-3 py-2 text-white focus:outline-none focus:border-substackOrange">
                        <option value="all" data-i18n="admin.all_statuses">Tất cả trạng thái</option>
                        <option value="active" data-i18n="admin.cats_active_badge">Đang kích hoạt</option>
                        <option value="inactive" data-i18n="admin.cats_inactive_badge">Đã tạm ẩn</option>
                    </select>
                </div>
            </form>

            <!-- Bảng danh mục -->
            <div class="bg-sidebarBg border border-borderDark rounded-2xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-cardBg/80 text-gray-400 uppercase font-semibold border-b border-borderDark text-[11px]">
                            <tr>
                                <th class="px-4 py-3" data-i18n="admin.col_id">ID</th>
                                <th class="px-4 py-3" data-i18n="admin.cats_name">Tên danh mục</th>
                                <th class="px-4 py-3" data-i18n="admin.cats_slug_full">Đường dẫn tĩnh (Slug)</th>
                                <th class="px-4 py-3" data-i18n="admin.cats_description">Mô tả</th>
                                <th class="px-4 py-3 text-center" data-i18n="admin.cats_post_count">Số bài viết</th>
                                <th class="px-4 py-3 text-center" data-i18n="admin.cats_status">Trạng thái</th>
                                <th class="px-4 py-3 text-right" data-i18n="common.actions">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody" class="divide-y divide-borderDark text-gray-300">
                            <!-- Render bằng JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Phân trang danh mục -->
            <div id="categoryPaginationBar" class="pt-2"></div>

        </main>
    </div>

    <!-- MODAL THÊM / CHỈNH SỬA DANH MỤC -->
    <div id="categoryModal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-sidebarBg border border-borderDark rounded-2xl w-full max-w-lg p-6 relative shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-borderDark pb-3">
                <h3 class="font-bold text-white text-base flex items-center space-x-2">
                    <i id="categoryModalIcon" class="fa-solid fa-layer-group text-substackOrange"></i>
                    <span id="categoryModalTitleText"></span>
                </h3>
                <button type="button" onclick="closeCategoryModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="categoryForm" novalidate class="space-y-4 text-xs">
                <!-- Tên danh mục -->
                <div class="form-group">
                    <label class="block font-semibold text-gray-300 mb-1" for="catNameInput" data-i18n="admin.cats_name_label">Tên danh mục *</label>
                    <input type="text" id="catNameInput" name="catNameInput" placeholder="Ví dụ: Công nghệ & Phần mềm" data-i18n-placeholder="admin.cats_name_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-white focus:outline-none focus:border-substackOrange">
                </div>

                <!-- Slug -->
                <div class="form-group">
                    <label class="block font-semibold text-gray-300 mb-1" for="catSlugInput" data-i18n="admin.cats_slug_label">Đường dẫn tĩnh (Slug) *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-mono select-none">/category/</span>
                        <input type="text" id="catSlugInput" name="catSlugInput" placeholder="cong-nghe-phan-mem" data-i18n-placeholder="admin.cats_slug_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl py-2.5 pl-24 pr-3 text-substackOrange font-mono focus:outline-none focus:border-substackOrange">
                    </div>
                </div>

                <!-- Mô tả -->
                <div class="form-group">
                    <label class="block font-semibold text-gray-300 mb-1" for="catDescInput" data-i18n="admin.cats_desc_label">Mô tả ngắn</label>
                    <textarea id="catDescInput" name="catDescInput" rows="3" placeholder="Tóm tắt nội dung các bài viết thuộc chuyên mục này..." data-i18n-placeholder="admin.cats_desc_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-white focus:outline-none focus:border-substackOrange"></textarea>
                </div>

                <!-- Trạng thái -->
                <div class="form-group">
                    <label class="block font-semibold text-gray-300 mb-1" for="catStatusInput" data-i18n="admin.cats_status_label">Trạng thái hiển thị</label>
                    <select id="catStatusInput" name="catStatusInput" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-white focus:outline-none focus:border-substackOrange">
                        <option value="true" data-i18n="admin.cats_status_active">Đang kích hoạt (Hiển thị công khai)</option>
                        <option value="false" data-i18n="admin.cats_status_inactive">Tạm ẩn (Không hiển thị ra giao diện độc giả)</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-2 pt-3 border-t border-borderDark">
                    <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 bg-cardBg text-gray-300 rounded-xl hover:bg-borderDark" data-i18n="common.cancel">Hủy</button>
                    <button type="submit" id="catSubmitBtn" class="px-5 py-2 bg-substackOrange hover:bg-substackOrangeHover text-white font-semibold rounded-xl shadow" data-i18n="admin.cats_save">Lưu danh mục</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script & Mock Data -->
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/validators.js"></script>
    <script src="../../assets/js/pagination.js"></script>
    <script src="../../assets/js/layout.js"></script>

    <script>
        let editingCatId = null;
        let categoryValidator = null;
        let searchQuery = '';
        let statusFilter = 'all';
        let searchDebounceTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            I18n.ready(() => {
                Layout.renderHeader('appHeader');
                Layout.renderAdminSidebar('categories', 'adminSidebar');

                categoryValidator = Validators.attach('#categoryForm', {
                    catNameInput: {
                        required: { message: I18n.t('admin.cats_required_name') },
                        maxLength: 80,
                        custom: (value) => {
                            const name = value.toLowerCase();
                            const exists = (MockData.categories || []).some(c =>
                                c.id !== editingCatId && c.name.toLowerCase() === name
                            );
                            return exists ? I18n.t('admin.cats_duplicate_name') : null;
                        }
                    },
                    catSlugInput: {
                        required: { message: I18n.t('admin.cats_required_slug') },
                        maxLength: 80,
                        pattern: { regex: /^[a-z0-9-]+$/, message: I18n.t('admin.cats_invalid_slug') },
                        custom: (value) => {
                            const exists = (MockData.categories || []).some(c =>
                                c.id !== editingCatId && c.slug.toLowerCase() === value.toLowerCase()
                            );
                            return exists ? I18n.t('admin.cats_duplicate_slug') : null;
                        }
                    },
                    catDescInput: {
                        maxLength: 300
                    }
                }, {
                    onSubmit: (values) => saveCategory(values)
                });

                // Tự sinh slug từ tên khi thêm mới
                document.getElementById('catNameInput').addEventListener('input', (e) => {
                    if (editingCatId) return;
                    document.getElementById('catSlugInput').value = slugify(e.target.value);
                });

                // Form lọc: submit bằng Enter + tìm kiếm trực tiếp khi gõ
                Validators.attach('#categoryFilterForm', {}, {
                    onSubmit: () => {
                        searchQuery = document.getElementById('catSearchInput').value.trim().toLowerCase();
                        statusFilter = document.getElementById('catStatusFilter').value;
                        renderCategories(true);
                    }
                });
                document.getElementById('catSearchInput').addEventListener('input', (e) => {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(() => {
                        searchQuery = e.target.value.trim().toLowerCase();
                        renderCategories(true);
                    }, 250);
                });
                document.getElementById('catStatusFilter').addEventListener('change', (e) => {
                    statusFilter = e.target.value;
                    renderCategories(true);
                });

                renderCategories();

                window.addEventListener('demoStateChanged', () => {
                    renderCategories(false);
                });
            });
        });

        function slugify(value) {
            return (value || '')
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/Đ/g, 'D')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9 -]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        function resetPageInUrl() {
            const url = new URL(window.location.href);
            if (url.searchParams.has('page') || url.searchParams.has('pageSize')) {
                url.searchParams.delete('page');
                url.searchParams.delete('pageSize');
                window.history.replaceState({}, '', url.toString());
            }
        }

        function getFilteredCategories() {
            let list = MockData.categories || [];
            if (searchQuery) {
                list = list.filter(c =>
                    c.name.toLowerCase().includes(searchQuery) ||
                    c.slug.toLowerCase().includes(searchQuery) ||
                    (c.description && c.description.toLowerCase().includes(searchQuery))
                );
            }
            if (statusFilter === 'active') {
                list = list.filter(c => c.is_active);
            } else if (statusFilter === 'inactive') {
                list = list.filter(c => !c.is_active);
            }
            return list;
        }

        function renderCategories(resetPage = false) {
            const state = Layout.getDemoState();
            const tbody = document.getElementById('categoryTableBody');
            const paginationBar = document.getElementById('categoryPaginationBar');

            if (resetPage) resetPageInUrl();

            // 1. Loading
            if (state === 'loading') {
                paginationBar.innerHTML = '';
                tbody.innerHTML = Array(3).fill(0).map(() => `
                    <tr><td colspan="7" class="px-4 py-4"><div class="h-6 bg-borderDark/40 rounded animate-pulse w-full"></div></td></tr>
                `).join('');
                return;
            }

            // 2. Error
            if (state === 'error') {
                paginationBar.innerHTML = '';
                tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-rose-400">${Layout.escapeHtml(I18n.t('common.error'))}</td></tr>`;
                return;
            }

            let categories = getFilteredCategories();

            // 3. Demo Empty
            if (state === 'empty') categories = [];

            if (categories.length === 0) {
                paginationBar.innerHTML = '';
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-4 py-8 text-center text-gray-500">
                            <i class="fa-regular fa-folder-open text-2xl mb-2 block"></i>
                            ${Layout.escapeHtml(I18n.t('admin.cats_no_results'))}
                        </td>
                    </tr>
                `;
                return;
            }

            Pagination.render({
                container: paginationBar,
                items: categories,
                pageSize: 10,
                pageSizeOptions: [10, 20, 50],
                syncUrl: true,
                onPageChange: (pagedCategories) => {
                    tbody.innerHTML = pagedCategories.map(cat => `
                        <tr class="hover:bg-cardBg/40 transition">
                            <td class="px-4 py-3 font-mono text-gray-400">#${Layout.escapeHtml(cat.id)}</td>
                            <td class="px-4 py-3 font-bold text-white">
                                <span>${Layout.escapeHtml(cat.name)}</span>
                            </td>
                            <td class="px-4 py-3 font-mono text-substackOrange text-[11px]">
                                /category/${Layout.escapeHtml(cat.slug)}
                            </td>
                            <td class="px-4 py-3 text-gray-400 max-w-xs truncate" title="${Layout.escapeHtml(cat.description || '')}">
                                ${cat.description
                                    ? Layout.escapeHtml(cat.description)
                                    : `<span class="italic text-gray-600">${Layout.escapeHtml(I18n.t('admin.cats_no_desc'))}</span>`}
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span class="bg-cardBg border border-borderDark px-2 py-0.5 rounded-full text-xs font-semibold text-gray-300">
                                    ${Layout.escapeHtml(I18n.t('admin.cats_post_count_value', { count: MockData.getCategoryPostCount(cat.id) }))}
                                </span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                ${cat.is_active ? `
                                    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full inline-flex items-center space-x-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                        <span>${Layout.escapeHtml(I18n.t('admin.cats_active'))}</span>
                                    </span>
                                ` : `
                                    <span class="bg-gray-700/40 text-gray-400 border border-borderDark text-[10px] font-semibold px-2.5 py-0.5 rounded-full inline-flex items-center space-x-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                                        <span>${Layout.escapeHtml(I18n.t('admin.cats_inactive'))}</span>
                                    </span>
                                `}
                            </td>
                            <td class="px-4 py-3 text-right">
                                <div class="inline-flex items-center space-x-1.5">
                                    <button onclick="openCategoryModal('edit', ${cat.id})" class="p-1.5 px-2 bg-cardBg hover:bg-borderDark border border-borderDark text-gray-300 hover:text-white rounded-lg transition" title="${Layout.escapeHtml(I18n.t('admin.cats_edit'))}">
                                        <i class="fa-regular fa-pen-to-square"></i>
                                    </button>
                                    <button onclick="deleteCategory(${cat.id})" class="p-1.5 px-2 bg-cardBg hover:bg-rose-950/60 border border-borderDark text-gray-400 hover:text-rose-400 rounded-lg transition" title="${Layout.escapeHtml(I18n.t('common.delete'))}">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }
            });
        }

        function openCategoryModal(mode, id = null) {
            editingCatId = mode === 'edit' ? id : null;

            const form = document.getElementById('categoryForm');
            const iconEl = document.getElementById('categoryModalIcon');
            const titleEl = document.getElementById('categoryModalTitleText');
            const nameInput = document.getElementById('catNameInput');
            const slugInput = document.getElementById('catSlugInput');
            const descInput = document.getElementById('catDescInput');
            const statusInput = document.getElementById('catStatusInput');

            form.reset();
            if (categoryValidator) categoryValidator.clear();

            if (mode === 'create') {
                iconEl.className = 'fa-solid fa-layer-group text-substackOrange';
                titleEl.textContent = I18n.t('admin.cats_add_title');
                statusInput.value = 'true';
            } else {
                const cat = MockData.categories.find(c => c.id === id);
                if (!cat) return;
                iconEl.className = 'fa-solid fa-pen-to-square text-substackOrange';
                titleEl.textContent = I18n.t('admin.cats_edit_title');
                nameInput.value = cat.name;
                slugInput.value = cat.slug;
                descInput.value = cat.description || '';
                statusInput.value = cat.is_active ? 'true' : 'false';
            }

            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
            editingCatId = null;
        }

        function saveCategory(values) {
            const name = (values.catNameInput || '').trim();
            const slug = (values.catSlugInput || '').trim();
            const description = (values.catDescInput || '').trim();
            const isActive = values.catStatusInput === 'true';

            if (editingCatId) {
                const cat = MockData.categories.find(c => c.id === editingCatId);
                if (cat) {
                    cat.name = name;
                    cat.slug = slug;
                    cat.description = description;
                    cat.is_active = isActive;
                    Layout.showToast(I18n.t('admin.cats_updated', { name }), 'success');
                }
            } else {
                MockData.categories.unshift({
                    id: Date.now(),
                    name: name,
                    slug: slug,
                    description: description,
                    post_count: 0,
                    is_active: isActive,
                    created_at: new Date().toISOString()
                });
                Layout.showToast(I18n.t('admin.cats_created', { name }), 'success');
            }

            closeCategoryModal();
            renderCategories(false);
            Layout.renderAdminSidebar('categories', 'adminSidebar');
        }

        function deleteCategory(id) {
            const cat = MockData.categories.find(c => c.id === id);
            if (!cat) return;

            const postCount = MockData.getCategoryPostCount(id);

            // Danh mục đã có bài viết: không xóa cứng, đề nghị chuyển sang tạm ẩn
            if (postCount > 0) {
                Layout.showConfirmModal({
                    title: I18n.t('admin.cats_delete_blocked_title'),
                    message: I18n.t('admin.cats_delete_blocked_message', { name: cat.name, count: postCount }),
                    confirmText: I18n.t('admin.cats_hide_action'),
                    onConfirm: () => {
                        cat.is_active = false;
                        Layout.showToast(I18n.t('admin.cats_hidden_toast', { name: cat.name }), 'info');
                        renderCategories(false);
                        Layout.renderAdminSidebar('categories', 'adminSidebar');
                    }
                });
                return;
            }

            Layout.showConfirmModal({
                title: I18n.t('admin.cats_delete_title'),
                message: I18n.t('admin.cats_delete_message', { name: cat.name }),
                confirmText: I18n.t('common.delete'),
                onConfirm: () => {
                    const idx = MockData.categories.findIndex(c => c.id === id);
                    if (idx !== -1) MockData.categories.splice(idx, 1);
                    Layout.showToast(I18n.t('admin.cats_deleted'), 'info');
                    renderCategories(false);
                    Layout.renderAdminSidebar('categories', 'adminSidebar');
                }
            });
        }
    </script>
</body>
</html>
