<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục | Admin Substack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full px-2 sm:px-4">
        <!-- Sidebar Admin -->
        <aside id="adminSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-5xl mx-auto w-full space-y-6">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderDark pb-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                        <i class="fa-solid fa-folder-tree text-substackOrange"></i>
                        <span>Quản lý danh mục bài viết</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-1">Phân loại cấu trúc bài viết và quản lý các nhóm nội dung hệ thống.</p>
                </div>

                <button onclick="openCategoryModal()" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Thêm danh mục</span>
                </button>
            </div>

            <!-- Bảng danh mục -->
            <div class="bg-sidebarBg border border-borderDark rounded-2xl overflow-hidden shadow-sm">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="bg-cardBg/80 border-b border-borderDark text-gray-400 font-bold uppercase tracking-wider text-[11px]">
                            <th class="p-3.5">ID</th>
                            <th class="p-3.5">Tên danh mục</th>
                            <th class="p-3.5">Slug</th>
                            <th class="p-3.5">Mô tả</th>
                            <th class="p-3.5 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTableBody" class="divide-y divide-borderDark"></tbody>
                </table>
            </div>

            <!-- Phân trang luôn hiển thị -->
            <div id="catPagination" class="pt-6 border-t border-borderDark flex items-center justify-between text-xs text-gray-400">
                <button id="catPrevBtn" onclick="changeCatPage(-1)" class="px-3.5 py-2 rounded-xl bg-cardBg border border-borderDark hover:bg-borderDark text-white disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Trang trước</span>
                </button>
                <span id="catPageInfo" class="font-medium text-gray-300">Trang 1 / 1</span>
                <button id="catNextBtn" onclick="changeCatPage(1)" class="px-3.5 py-2 rounded-xl bg-cardBg border border-borderDark hover:bg-borderDark text-white disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1.5 transition">
                    <span>Trang sau</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </main>
    </div>

    <!-- Modal Thêm/Sửa Danh mục với Inline Validation -->
    <div id="categoryModal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-sidebarBg border border-borderDark rounded-2xl w-full max-w-md p-6 relative shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-borderDark pb-3">
                <h3 id="catModalTitle" class="font-bold text-white text-base">Thêm danh mục mới</h3>
                <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Tên danh mục *</label>
                    <input type="text" id="catNameInput" placeholder="Ví dụ: Công nghệ & Phần mềm" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-xs text-white focus:outline-none transition">
                    <p id="catNameError" class="field-error-message hidden text-[11px] text-rose-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i><span></span>
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Slug *</label>
                    <input type="text" id="catSlugInput" placeholder="cong-nghe-phan-mem" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-xs text-white font-mono focus:outline-none transition">
                    <p id="catSlugError" class="field-error-message hidden text-[11px] text-rose-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i><span></span>
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Mô tả</label>
                    <textarea id="catDescInput" rows="2" placeholder="Mô tả tóm tắt về danh mục này..." class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-xs text-white focus:outline-none transition resize-none"></textarea>
                    <p id="catDescError" class="field-error-message hidden text-[11px] text-rose-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i><span></span>
                    </p>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-borderDark">
                <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 bg-cardBg text-gray-300 text-xs rounded-xl hover:bg-borderDark border border-borderDark transition">Hủy</button>
                <button type="button" onclick="saveCategory()" class="px-5 py-2 bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold rounded-xl shadow transition">Lưu danh mục</button>
            </div>
        </div>
    </div>

    <!-- Script nạp đúng 2 cấp thư mục -->
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>

    <script>
        let currentCatPage = 1;
        const CATS_PER_PAGE = 4;
        let editingCatId = null;

        // Dữ liệu mẫu khởi tạo phòng khi MockData chưa khởi tạo
        if (!window.MockData) window.MockData = {};
        if (!Array.isArray(window.MockData.categories) || window.MockData.categories.length === 0) {
            window.MockData.categories = [
                { id: 101, name: 'Công nghệ & Phần mềm', slug: 'cong-nghe', description: 'Chuyên sâu về kiến trúc hệ thống và code' },
                { id: 102, name: 'Hạ tầng & Cloud', slug: 'ha-tang-cloud', description: 'DevOps, CI/CD và điện toán đám mây' },
                { id: 103, name: 'Design & UI/UX', slug: 'design-ui-ux', description: 'Thiết kế sản phẩm và trải nghiệm người dùng' },
                { id: 104, name: 'Kiến thức tổng quát', slug: 'tong-quat', description: 'Các bài viết đa chủ đề trong cuộc sống' }
            ];
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Layout) {
                Layout.renderHeader('appHeader');
                Layout.renderAdminSidebar('categories', 'adminSidebar');
            }
            renderCategories();
            bindInlineValidation();
        });

        function setCatErr(inputEl, errElId, msg) {
            const errEl = document.getElementById(errElId);
            if (!errEl) return !msg;
            if (msg) {
                inputEl.classList.add('border-rose-500');
                inputEl.classList.remove('border-borderDark');
                const span = errEl.querySelector('span');
                if (span) span.textContent = msg;
                errEl.classList.remove('hidden');
                return false;
            } else {
                inputEl.classList.remove('border-rose-500');
                inputEl.classList.add('border-borderDark');
                errEl.classList.add('hidden');
                return true;
            }
        }

        function generateSlug(text) {
            return text
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9 -]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        function bindInlineValidation() {
            const nameInput = document.getElementById('catNameInput');
            const slugInput = document.getElementById('catSlugInput');
            const descInput = document.getElementById('catDescInput');

            nameInput.addEventListener('input', () => {
                const val = nameInput.value.trim();
                if (!val) return setCatErr(nameInput, 'catNameError', 'Tên danh mục không được để trống.');
                if (typeof containsHTML === 'function' && containsHTML(val)) return setCatErr(nameInput, 'catNameError', 'Không được chứa thẻ HTML.');
                setCatErr(nameInput, 'catNameError', '');
                
                if (!editingCatId) {
                    slugInput.value = generateSlug(val);
                    setCatErr(slugInput, 'catSlugError', '');
                }
            });

            slugInput.addEventListener('input', () => {
                const val = slugInput.value.trim();
                if (!val) return setCatErr(slugInput, 'catSlugError', 'Slug không được để trống.');
                if (typeof containsHTML === 'function' && containsHTML(val)) return setCatErr(slugInput, 'catSlugError', 'Không được chứa thẻ HTML.');
                setCatErr(slugInput, 'catSlugError', '');
            });

            descInput.addEventListener('input', () => {
                const val = descInput.value.trim();
                if (typeof containsHTML === 'function' && containsHTML(val)) return setCatErr(descInput, 'catDescError', 'Không được chứa thẻ HTML.');
                setCatErr(descInput, 'catDescError', '');
            });
        }

        function renderCategories() {
            const tbody = document.getElementById('categoryTableBody');
            if (!tbody) return;

            const list = MockData.categories || [];
            const totalPages = Math.ceil(list.length / CATS_PER_PAGE) || 1;
            if (currentCatPage > totalPages) currentCatPage = totalPages;
            if (currentCatPage < 1) currentCatPage = 1;

            document.getElementById('catPageInfo').textContent = `Trang ${currentCatPage} / ${totalPages} (${list.length} danh mục)`;
            document.getElementById('catPrevBtn').disabled = (currentCatPage === 1);
            document.getElementById('catNextBtn').disabled = (currentCatPage === totalPages || list.length === 0);

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Chưa có danh mục nào. Bấm "Thêm danh mục" để tạo mới.</td></tr>`;
                return;
            }

            const start = (currentCatPage - 1) * CATS_PER_PAGE;
            const paginated = list.slice(start, start + CATS_PER_PAGE);

            tbody.innerHTML = paginated.map(c => `
                <tr class="hover:bg-cardBg/40 transition">
                    <td class="p-3.5 font-mono text-gray-500">#${c.id}</td>
                    <td class="p-3.5 font-bold text-white">${c.name}</td>
                    <td class="p-3.5 text-gray-400 font-mono">/${c.slug}</td>
                    <td class="p-3.5 text-gray-400 max-w-xs truncate">${c.description || '<span class="italic text-gray-600">Không có mô tả</span>'}</td>
                    <td class="p-3.5 text-right space-x-2 whitespace-nowrap">
                        <button onclick="editCategory(${c.id})" class="px-2.5 py-1 bg-cardBg hover:bg-borderDark border border-borderDark rounded text-gray-300 transition">Sửa</button>
                        <button onclick="deleteCategory(${c.id})" class="px-2.5 py-1 bg-cardBg hover:bg-rose-950/60 border border-borderDark rounded text-rose-400 transition">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function changeCatPage(delta) {
            currentCatPage += delta;
            renderCategories();
        }

        function openCategoryModal(cat = null) {
            editingCatId = cat ? cat.id : null;
            document.getElementById('catModalTitle').textContent = cat ? 'Sửa danh mục' : 'Thêm danh mục mới';
            const nameEl = document.getElementById('catNameInput');
            const slugEl = document.getElementById('catSlugInput');
            const descEl = document.getElementById('catDescInput');

            nameEl.value = cat ? cat.name : '';
            slugEl.value = cat ? cat.slug : '';
            descEl.value = cat ? (cat.description || '') : '';

            setCatErr(nameEl, 'catNameError', '');
            setCatErr(slugEl, 'catSlugError', '');
            setCatErr(descEl, 'catDescError', '');
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
            editingCatId = null;
        }

        function editCategory(id) {
            const cat = MockData.categories.find(c => c.id === id);
            if (cat) openCategoryModal(cat);
        }

        function saveCategory() {
            const nameEl = document.getElementById('catNameInput');
            const slugEl = document.getElementById('catSlugInput');
            const descEl = document.getElementById('catDescInput');

            const name = nameEl.value.trim();
            const slug = slugEl.value.trim();
            const desc = descEl.value.trim();

            if (!name) { setCatErr(nameEl, 'catNameError', 'Tên danh mục không được để trống.'); nameEl.focus(); return; }
            if (typeof containsHTML === 'function' && containsHTML(name)) { setCatErr(nameEl, 'catNameError', 'Không được chứa thẻ HTML.'); nameEl.focus(); return; }
            if (!slug) { setCatErr(slugEl, 'catSlugError', 'Slug không được để trống.'); slugEl.focus(); return; }
            if (typeof containsHTML === 'function' && containsHTML(slug)) { setCatErr(slugEl, 'catSlugError', 'Không được chứa thẻ HTML.'); slugEl.focus(); return; }
            if (typeof containsHTML === 'function' && containsHTML(desc)) { setCatErr(descEl, 'catDescError', 'Không được chứa thẻ HTML.'); descEl.focus(); return; }

            if (editingCatId) {
                const cat = MockData.categories.find(c => c.id === editingCatId);
                if (cat) {
                    cat.name = name;
                    cat.slug = slug;
                    cat.description = desc;
                }
            } else {
                MockData.categories.push({
                    id: Date.now(),
                    name: name,
                    slug: slug,
                    description: desc
                });
            }

            closeCategoryModal();
            if (window.Layout) Layout.showToast('Lưu danh mục thành công!', 'success');
            renderCategories();
        }

        function deleteCategory(id) {
            if (window.Layout) {
                Layout.showConfirmModal({
                    title: 'Xóa danh mục',
                    message: 'Bạn có chắc chắn muốn xóa danh mục này? Hành động này không thể hoàn tác.',
                    confirmText: 'Xác nhận xóa',
                    onConfirm: () => {
                        const idx = MockData.categories.findIndex(c => c.id === id);
                        if (idx !== -1) {
                            MockData.categories.splice(idx, 1);
                            Layout.showToast('Đã xóa danh mục thành công!', 'success');
                            renderCategories();
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
