<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.users_page_title">Quản lý người dùng | Admin Substack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 w-full">
        <!-- Sidebar Admin -->
        <aside id="adminSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-6xl w-full space-y-6">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderDark pb-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                        <i class="fa-solid fa-users-gear text-substackOrange"></i>
                        <span data-i18n="admin.users_title">Quản lý tài khoản người dùng</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-1" data-i18n="admin.users_subtitle">Danh sách thành viên, phân quyền vai trò và thực thi các biện pháp kỷ luật khóa tài khoản.</p>
                </div>
            </div>

            <!-- Thanh Tìm Kiếm & Bộ Lọc -->
            <form id="userFilterForm" novalidate class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-sidebarBg p-4 rounded-2xl border border-borderDark text-xs">
                <!-- Ô tìm kiếm -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500"></i>
                    <input type="text" id="userSearchInput" name="userSearch" oninput="renderUsersTable()" placeholder="Tìm theo tên, @handle, email..." data-i18n-placeholder="admin.search_users" class="w-full bg-darkBg border border-borderDark rounded-xl pl-8 pr-3 py-2 text-white focus:outline-none focus:border-substackOrange">
                </div>

                <!-- Lọc vai trò -->
                <div class="flex items-center space-x-2">
                    <span class="text-gray-400 font-semibold whitespace-nowrap" data-i18n="admin.filter_role">Vai trò:</span>
                    <select id="userRoleFilter" name="userRole" onchange="renderUsersTable()" class="w-full bg-darkBg border border-borderDark rounded-xl px-3 py-2 text-white focus:outline-none">
                        <option value="all" data-i18n="admin.all_roles">Tất cả vai trò</option>
                        <option value="1" data-i18n="admin.role_admin">Admin (Quản trị viên)</option>
                        <option value="2" data-i18n="admin.role_blogger">Blogger (Tác giả)</option>
                        <option value="3" data-i18n="admin.role_user">User (Độc giả)</option>
                    </select>
                </div>

                <!-- Lọc trạng thái -->
                <div class="flex items-center space-x-2">
                    <span class="text-gray-400 font-semibold whitespace-nowrap" data-i18n="admin.filter_status">Trạng thái:</span>
                    <select id="userStatusFilter" name="userStatus" onchange="renderUsersTable()" class="w-full bg-darkBg border border-borderDark rounded-xl px-3 py-2 text-white focus:outline-none">
                        <option value="all" data-i18n="admin.all_statuses">Tất cả trạng thái</option>
                        <option value="active" data-i18n="admin.status_active">Đang hoạt động</option>
                        <option value="banned" data-i18n="admin.status_banned">Bị đình chỉ (Banned)</option>
                    </select>
                </div>
            </form>

            <!-- Bảng Người Dùng -->
            <div class="bg-sidebarBg border border-borderDark rounded-2xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-cardBg/80 border-b border-borderDark text-gray-400 font-bold uppercase tracking-wider text-[11px]">
                                <th class="p-3.5" data-i18n="admin.member">Thành viên</th>
                                <th class="p-3.5" data-i18n="common.email">Email</th>
                                <th class="p-3.5" data-i18n="common.role">Vai trò</th>
                                <th class="p-3.5" data-i18n="common.status">Trạng thái</th>
                                <th class="p-3.5" data-i18n="admin.joined_and_ban">Ngày tham gia & Lý do khóa</th>
                                <th class="p-3.5 text-right" data-i18n="common.actions">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y divide-borderDark">
                            <!-- Render qua JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Phân trang người dùng -->
            <div id="usersPaginationBar" class="pt-2"></div>

        </main>
    </div>

    <!-- MODAL KHÓA TÀI KHOẢN (BAN) -->
    <div id="banUserModal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-sidebarBg border border-borderDark rounded-2xl w-full max-w-md p-6 relative shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-borderDark pb-3">
                <div class="flex items-center space-x-2 text-red-400">
                    <i class="fa-solid fa-user-slash"></i>
                    <h3 class="font-bold text-white text-base" data-i18n="admin.ban_modal_title">Đình chỉ tài khoản thành viên</h3>
                </div>
                <button type="button" onclick="closeBanModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="banUserInfo" class="p-3 bg-darkBg rounded-xl border border-borderDark text-xs">
                <!-- Thông tin thành viên -->
            </div>

            <form id="banUserForm" novalidate class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5" for="banReasonInput" data-i18n="admin.ban_reason_label">Lý do khóa tài khoản (bắt buộc) *</label>
                    <textarea id="banReasonInput" name="banReason" rows="3" placeholder="Nhập căn cứ xử phạt (ví dụ: Vi phạm quy định chống spam, phát tán nội dung độc hại...)" data-i18n-placeholder="admin.ban_reason_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl p-3 text-xs text-white focus:outline-none focus:border-red-500"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-2 border-t border-borderDark">
                    <button type="button" onclick="closeBanModal()" class="px-4 py-2 bg-cardBg text-gray-300 text-xs rounded-xl hover:bg-borderDark" data-i18n="common.cancel">Hủy</button>
                    <button type="submit" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-xl shadow" data-i18n="admin.confirm_ban">Xác nhận Ban</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script & Mock Data -->
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/validators.js"></script>
    <script src="../../assets/js/pagination.js"></script>
    <script src="../../assets/js/layout.js"></script>

    <script>
        let targetUserIdForBan = null;
        let banUserValidator = null;

        document.addEventListener('DOMContentLoaded', () => {
            I18n.ready(() => {
                Layout.renderHeader('appHeader');
                Layout.renderAdminSidebar('users', 'adminSidebar');

                Validators.attach('#userFilterForm', {
                    userSearch: {},
                    userRole: {},
                    userStatus: {}
                }, {
                    onSubmit: () => renderUsersTable()
                });

                banUserValidator = Validators.attach('#banUserForm', {
                    banReason: {
                        required: { message: I18n.t('admin.ban_error') },
                        maxLength: 300
                    }
                }, {
                    onSubmit: (values) => confirmBanUser(values)
                });

                renderUsersTable();

                window.addEventListener('demoStateChanged', () => {
                    renderUsersTable(false);
                });
            });
        });

        function resetPageInUrl() {
            const url = new URL(window.location.href);
            if (url.searchParams.has('page') || url.searchParams.has('pageSize')) {
                url.searchParams.delete('page');
                url.searchParams.delete('pageSize');
                window.history.replaceState({}, '', url.toString());
            }
        }

        function renderUsersTable(resetPage = true) {
            const state = Layout.getDemoState();
            const tbody = document.getElementById('usersTableBody');
            const paginationBar = document.getElementById('usersPaginationBar');
            const search = (document.getElementById('userSearchInput').value || '').trim().toLowerCase();
            const roleFilter = document.getElementById('userRoleFilter').value;
            const statusFilter = document.getElementById('userStatusFilter').value;
            const currentUser = Layout.getCurrentUser();

            if (resetPage) resetPageInUrl();

            // 1. Loading
            if (state === 'loading') {
                paginationBar.innerHTML = '';
                tbody.innerHTML = Array(3).fill(0).map(() => `
                    <tr><td colspan="6" class="p-4 text-center"><div class="h-6 bg-borderDark/40 rounded animate-pulse w-full"></div></td></tr>
                `).join('');
                return;
            }

            // 2. Error
            if (state === 'error') {
                paginationBar.innerHTML = '';
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-400">${Layout.escapeHtml(I18n.t('admin.users_load_error'))}</td></tr>`;
                return;
            }

            let users = [...MockData.users];

            // 3. Demo Empty
            if (state === 'empty') users = [];

            // Tìm kiếm
            if (search) {
                users = users.filter(u =>
                    u.display_name.toLowerCase().includes(search) ||
                    u.handle.toLowerCase().includes(search) ||
                    u.email.toLowerCase().includes(search)
                );
            }

            // Lọc vai trò
            if (roleFilter !== 'all') {
                users = users.filter(u => u.role_id === parseInt(roleFilter, 10));
            }

            // Lọc trạng thái
            if (statusFilter === 'active') {
                users = users.filter(u => u.is_active);
            } else if (statusFilter === 'banned') {
                users = users.filter(u => !u.is_active);
            }

            if (users.length === 0) {
                paginationBar.innerHTML = '';
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">${Layout.escapeHtml(I18n.t('admin.no_user_results'))}</td></tr>`;
                return;
            }

            const roleBadges = {
                1: `<span class="px-2 py-0.5 rounded bg-rose-950/60 border border-rose-500/40 text-rose-400 font-bold">${Layout.escapeHtml(I18n.t('admin.badge_admin'))}</span>`,
                2: `<span class="px-2 py-0.5 rounded bg-substackOrange/20 border border-substackOrange/40 text-substackOrange font-bold">${Layout.escapeHtml(I18n.t('admin.badge_blogger'))}</span>`,
                3: `<span class="px-2 py-0.5 rounded bg-darkBg border border-borderDark text-gray-300">${Layout.escapeHtml(I18n.t('admin.badge_user'))}</span>`
            };

            Pagination.render({
                container: paginationBar,
                items: users,
                pageSize: 10,
                pageSizeOptions: [10, 20, 50],
                syncUrl: true,
                onPageChange: (pagedUsers) => {
                    tbody.innerHTML = pagedUsers.map(user => {
                        const isSelf = currentUser && currentUser.id === user.id;
                        const statusBadge = user.is_active
                            ? `<span class="px-2 py-0.5 bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 font-bold rounded">${Layout.escapeHtml(I18n.t('admin.status_active_badge'))}</span>`
                            : `<span class="px-2 py-0.5 bg-red-950/60 border border-red-500/40 text-red-400 font-bold rounded">${Layout.escapeHtml(I18n.t('admin.status_banned_badge'))}</span>`;

                        return `
                            <tr class="hover:bg-cardBg/40 transition">
                                <td class="p-3.5">
                                    <div class="flex items-center space-x-3">
                                        <img src="${Layout.escapeHtml(user.avatar_url)}" alt="${Layout.escapeHtml(I18n.t('admin.avatar_alt'))}" class="w-8 h-8 rounded-full object-cover border border-borderDark">
                                        <div>
                                            <div class="font-bold text-white flex items-center space-x-1.5">
                                                <span>${Layout.escapeHtml(user.display_name)}</span>
                                                ${isSelf ? `<span class="text-[9px] bg-borderDark px-1.5 py-0.2 rounded text-gray-400 font-normal">${Layout.escapeHtml(I18n.t('admin.you'))}</span>` : ''}
                                            </div>
                                            <a href="../profile.html?handle=${encodeURIComponent(user.handle)}" target="_blank" class="text-gray-400 hover:text-substackOrange text-[11px]">@${Layout.escapeHtml(user.handle)}</a>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-3.5 font-mono text-gray-300">${Layout.escapeHtml(user.email)}</td>
                                <td class="p-3.5">${roleBadges[user.role_id] || ''}</td>
                                <td class="p-3.5">${statusBadge}</td>
                                <td class="p-3.5 max-w-xs text-[11px]">
                                    <div>${Layout.escapeHtml(I18n.t('admin.joined_at', { date: Layout.formatDate(user.created_at) }))}</div>
                                    ${!user.is_active ? `
                                        <div class="text-red-400 mt-1 leading-snug">
                                            <strong>${Layout.escapeHtml(I18n.t('admin.banned_at', { date: Layout.formatDate(user.banned_at) }))}</strong><br>
                                            <strong>${Layout.escapeHtml(I18n.t('admin.reason'))}</strong> ${Layout.escapeHtml(user.ban_reason || I18n.t('admin.unknown_ban_reason'))}
                                        </div>
                                    ` : ''}
                                </td>
                                <td class="p-3.5 text-right whitespace-nowrap">
                                    ${isSelf ? `
                                        <span class="text-gray-500 text-[11px] italic">${Layout.escapeHtml(I18n.t('admin.cannot_self_ban'))}</span>
                                    ` : (user.is_active ? `
                                        <button onclick="openBanModal(${user.id})" class="px-3 py-1.5 bg-cardBg hover:bg-red-950/60 text-gray-300 hover:text-red-400 border border-borderDark rounded-xl transition font-medium">
                                            <i class="fa-solid fa-ban mr-1"></i> ${Layout.escapeHtml(I18n.t('admin.ban_user'))}
                                        </button>
                                    ` : `
                                        <button onclick="unbanUser(${user.id})" class="px-3 py-1.5 bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-500/40 text-emerald-300 rounded-xl transition font-medium">
                                            <i class="fa-solid fa-lock-open mr-1"></i> ${Layout.escapeHtml(I18n.t('admin.unban'))}
                                        </button>
                                    `)}
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            });
        }

        function openBanModal(userId) {
            targetUserIdForBan = userId;
            const user = MockData.users.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('banUserForm').reset();
            if (banUserValidator) banUserValidator.clear();
            document.getElementById('banUserInfo').innerHTML = `
                <div class="font-bold text-white">${Layout.escapeHtml(user.display_name)} (@${Layout.escapeHtml(user.handle)})</div>
                <div class="text-gray-400">${Layout.escapeHtml(I18n.t('common.email'))}: ${Layout.escapeHtml(user.email)}</div>
            `;
            document.getElementById('banUserModal').classList.remove('hidden');
        }

        function closeBanModal() {
            document.getElementById('banUserModal').classList.add('hidden');
            targetUserIdForBan = null;
        }

        function confirmBanUser(values) {
            const reason = (values.banReason || '').trim();
            const user = MockData.users.find(u => u.id === targetUserIdForBan);
            if (user) {
                user.is_active = false;
                user.ban_reason = reason;
                user.banned_at = new Date().toISOString();

                closeBanModal();
                Layout.showToast(I18n.t('admin.ban_success', { handle: user.handle }), 'success');
                renderUsersTable(false);
            }
        }

        function unbanUser(userId) {
            const user = MockData.users.find(u => u.id === userId);
            if (!user) return;

            Layout.showConfirmModal({
                title: I18n.t('admin.unban_title'),
                message: I18n.t('admin.unban_message', { name: user.display_name, handle: user.handle }),
                confirmText: I18n.t('admin.unban_confirm'),
                confirmClass: 'bg-emerald-600 hover:bg-emerald-700',
                onConfirm: () => {
                    user.is_active = true;
                    user.ban_reason = null;
                    user.banned_at = null;
                    Layout.showToast(I18n.t('admin.unban_success', { handle: user.handle }), 'success');
                    renderUsersTable(false);
                }
            });
        }
    </script>
</body>
</html>
