<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý ngôn ngữ | Admin Substack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full px-2 sm:px-4">
        <!-- Sidebar Admin -->
        <aside id="adminSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-5xl mx-auto w-full space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderDark pb-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                        <i class="fa-solid fa-language text-substackOrange"></i>
                        <span>Quản trị danh mục ngôn ngữ</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-1">Cấu hình các ngôn ngữ hỗ trợ xuất bản và chuyển đổi giao diện trong hệ thống.</p>
                </div>
                <button onclick="openAddLangModal()" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Thêm ngôn ngữ mới</span>
                </button>
            </div>

            <!-- Bảng danh sách ngôn ngữ -->
            <div class="bg-sidebarBg border border-borderDark rounded-2xl overflow-hidden shadow-sm">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-cardBg/80 border-b border-borderDark text-gray-400 font-bold uppercase tracking-wider text-[11px]">
                            <th class="p-3.5">Mã Code</th>
                            <th class="p-3.5">Tên hiển thị</th>
                            <th class="p-3.5">Mặc định hệ thống</th>
                            <th class="p-3.5">Trạng thái hoạt động</th>
                            <th class="p-3.5 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="languagesTableBody" class="divide-y divide-borderDark"></tbody>
                </table>
            </div>

            <!-- Phân trang luôn hiển thị -->
            <div id="languagesPaginationBar" class="pt-6 border-t border-borderDark flex items-center justify-between text-xs text-gray-400">
                <button id="langPrevBtn" onclick="changeLangPage(-1)" class="px-3.5 py-2 rounded-xl bg-cardBg border border-borderDark hover:bg-borderDark text-white transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1.5">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Trang trước</span>
                </button>
                <span id="langPageInfoText" class="font-medium">Trang 1 / 1</span>
                <button id="langNextBtn" onclick="changeLangPage(1)" class="px-3.5 py-2 rounded-xl bg-cardBg border border-borderDark hover:bg-borderDark text-white transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1.5">
                    <span>Trang sau</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Modal Thêm Ngôn Ngữ mới -->
    <div id="addLangModal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-sidebarBg border border-borderDark rounded-2xl w-full max-w-md p-6 relative shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-borderDark pb-3">
                <h3 class="font-bold text-white text-base">Thêm ngôn ngữ hỗ trợ</h3>
                <button onclick="closeAddLangModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-300 mb-1">Mã code ngôn ngữ (ISO 639-1) *</label>
                    <input type="text" id="langCodeInput" placeholder="fr, de, ja..." maxlength="5" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-white lowercase focus:outline-none transition">
                    <p id="langCodeError" class="field-error-message hidden text-[11px] text-rose-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i><span></span>
                    </p>
                </div>
                <div>
                    <label class="block font-bold text-gray-300 mb-1">Tên ngôn ngữ *</label>
                    <input type="text" id="langNameInput" placeholder="Français (Pháp)..." class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-white focus:outline-none transition">
                    <p id="langNameError" class="field-error-message hidden text-[11px] text-rose-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i><span></span>
                    </p>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-borderDark">
                <button onclick="closeAddLangModal()" class="px-4 py-2 bg-cardBg text-gray-300 text-xs rounded-xl hover:bg-borderDark">Hủy</button>
                <button onclick="submitNewLanguage()" class="px-5 py-2 bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold rounded-xl shadow">Thêm vào hệ thống</button>
            </div>
        </div>
    </div>

    <!-- Nạp file script (tự động nhận diện cả đường dẫn tương đối ../.. và ../) -->
    <script>
        function loadScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = () => resolve(true);
                s.onerror = () => resolve(false);
                document.head.appendChild(s);
            });
        }

        async function initScripts() {
            // Thử load từ ../../assets nếu nằm ở frontend/pages/admin/
            let ok = await loadScript('../../assets/js/mock-data.js');
            if (!ok) await loadScript('../assets/js/mock-data.js');

            ok = await loadScript('../../assets/js/i18n.js');
            if (!ok) await loadScript('../assets/js/i18n.js');

            ok = await loadScript('../../assets/js/layout.js');
            if (!ok) await loadScript('../assets/js/layout.js');

            startApp();
        }

        window.addEventListener('DOMContentLoaded', initScripts);
    </script>

    <script>
        let currentLangPage = 1;
        const LANG_PER_PAGE = 5;

        function startApp() {
            // Đảm bảo luôn có mock dữ liệu phòng trường hợp load file bị chậm
            if (!window.MockData) window.MockData = {};
            if (!Array.isArray(window.MockData.languages) || window.MockData.languages.length === 0) {
                window.MockData.languages = [
                    { id: 1, code: 'vi', name: 'Tiếng Việt', is_active: true, is_default: true },
                    { id: 2, code: 'en', name: 'English', is_active: true, is_default: false },
                    { id: 3, code: 'ja', name: '日本語 (Japanese)', is_active: false, is_default: false }
                ];
            }

            if (window.Layout) {
                Layout.renderHeader('appHeader');
                Layout.renderAdminSidebar('languages', 'adminSidebar');
            }

            renderLanguagesTable();
            bindLangValidation();
        }

        const codeEl = () => document.getElementById('langCodeInput');
        const nameEl = () => document.getElementById('langNameInput');

        function setLangErr(inputEl, errElId, msg) {
            const errEl = document.getElementById(errElId);
            if (!errEl) return;
            if (msg) {
                inputEl.classList.add('border-rose-500');
                inputEl.classList.remove('border-borderDark');
                errEl.querySelector('span').textContent = msg;
                errEl.classList.remove('hidden');
                return false;
            } else {
                inputEl.classList.remove('border-rose-500');
                inputEl.classList.add('border-borderDark');
                errEl.classList.add('hidden');
                return true;
            }
        }

        function validateCode() {
            const el = codeEl();
            const val = el.value.trim().toLowerCase();
            if (!val) return setLangErr(el, 'langCodeError', 'Mã code không được để trống.');
            if (window.containsHTML && containsHTML(val)) return setLangErr(el, 'langCodeError', 'Không được chứa thẻ HTML.');
            if (!/^[a-z]{2,5}$/.test(val)) return setLangErr(el, 'langCodeError', 'Mã gồm từ 2-5 chữ cái thường (vd: vi, en, ja).');
            if (MockData.languages.some(l => l.code === val)) return setLangErr(el, 'langCodeError', 'Mã ngôn ngữ này đã tồn tại.');
            return setLangErr(el, 'langCodeError', '');
        }

        function validateName() {
            const el = nameEl();
            const val = el.value.trim();
            if (!val) return setLangErr(el, 'langNameError', 'Tên ngôn ngữ không được để trống.');
            if (window.containsHTML && containsHTML(val)) return setLangErr(el, 'langNameError', 'Không được chứa thẻ HTML.');
            return setLangErr(el, 'langNameError', '');
        }

        function bindLangValidation() {
            const c = codeEl();
            const n = nameEl();
            if (c) c.addEventListener('input', validateCode);
            if (n) n.addEventListener('input', validateName);
        }

        function renderLanguagesTable() {
            const tbody = document.getElementById('languagesTableBody');
            if (!tbody) return;

            const list = MockData.languages || [];
            const totalPages = Math.ceil(list.length / LANG_PER_PAGE) || 1;
            if (currentLangPage > totalPages) currentLangPage = totalPages;
            if (currentLangPage < 1) currentLangPage = 1;

            document.getElementById('langPageInfoText').textContent = `Trang ${currentLangPage} / ${totalPages} (${list.length} ngôn ngữ)`;
            document.getElementById('langPrevBtn').disabled = (currentLangPage === 1);
            document.getElementById('langNextBtn').disabled = (currentLangPage === totalPages || list.length === 0);

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Chưa có dữ liệu ngôn ngữ.</td></tr>`;
                return;
            }

            const start = (currentLangPage - 1) * LANG_PER_PAGE;
            const paginated = list.slice(start, start + LANG_PER_PAGE);

            tbody.innerHTML = paginated.map(lang => `
                <tr class="hover:bg-cardBg/40 transition">
                    <td class="p-3.5 font-mono text-sm font-bold text-white uppercase">${lang.code}</td>
                    <td class="p-3.5 font-bold text-gray-200">${lang.name}</td>
                    <td class="p-3.5">
                        ${lang.is_default ? `
                            <span class="px-2.5 py-1 bg-substackOrange/20 border border-substackOrange/40 text-substackOrange text-[10px] font-bold rounded-lg inline-flex items-center space-x-1">
                                <i class="fa-solid fa-star"></i><span>MẶC ĐỊNH</span>
                            </span>
                        ` : `
                            <button onclick="setDefaultLanguage(${lang.id})" class="text-xs text-gray-400 hover:text-white underline">Đặt làm mặc định</button>
                        `}
                    </td>
                    <td class="p-3.5">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" ${lang.is_active ? 'checked' : ''} ${lang.is_default ? 'disabled' : ''} onchange="toggleLangActive(${lang.id}, this.checked)" class="sr-only peer">
                            <div class="w-9 h-5 bg-borderDark peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600 ${lang.is_default ? 'opacity-60 cursor-not-allowed' : ''}"></div>
                            <span class="ml-2 text-xs font-medium ${lang.is_active ? 'text-emerald-400' : 'text-gray-500'}">
                                ${lang.is_active ? 'Hoạt động' : 'Tắt'}
                            </span>
                        </label>
                    </td>
                    <td class="p-3.5 text-right whitespace-nowrap">
                        <button onclick="deleteLang(${lang.id})" class="px-2.5 py-1 text-gray-400 hover:text-rose-400 border border-borderDark rounded-lg ${lang.is_default ? 'hidden' : ''}">
                            <i class="fa-solid fa-trash-can mr-1"></i>Xóa
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function changeLangPage(delta) {
            currentLangPage += delta;
            renderLanguagesTable();
        }

        function toggleLangActive(langId, active) {
            const lang = MockData.languages.find(l => l.id === langId);
            if (!lang) return;
            if (lang.is_default && !active) {
                if (window.Layout) Layout.showToast('Không thể tắt ngôn ngữ mặc định.', 'warning');
                renderLanguagesTable();
                return;
            }
            lang.is_active = active;
            renderLanguagesTable();
        }

        function setDefaultLanguage(langId) {
            MockData.languages.forEach(l => {
                l.is_default = (l.id === langId);
                if (l.is_default) l.is_active = true;
            });
            renderLanguagesTable();
        }

        function deleteLang(langId) {
            const idx = MockData.languages.findIndex(l => l.id === langId);
            if (idx !== -1) {
                MockData.languages.splice(idx, 1);
                renderLanguagesTable();
            }
        }

        function openAddLangModal() {
            codeEl().value = '';
            nameEl().value = '';
            setLangErr(codeEl(), 'langCodeError', '');
            setLangErr(nameEl(), 'langNameError', '');
            document.getElementById('addLangModal').classList.remove('hidden');
        }

        function closeAddLangModal() {
            document.getElementById('addLangModal').classList.add('hidden');
        }

        function submitNewLanguage() {
            const okCode = validateCode();
            const okName = validateName();
            if (!okCode) { codeEl().focus(); return; }
            if (!okName) { nameEl().focus(); return; }

            MockData.languages.push({
                id: Date.now(),
                code: codeEl().value.trim().toLowerCase(),
                name: nameEl().value.trim(),
                is_active: true,
                is_default: false
            });

            closeAddLangModal();
            renderLanguagesTable();
        }
    </script>
</body>
</html>
