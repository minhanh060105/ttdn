<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.page_title">Đăng nhập | Substack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col justify-between p-4">

    <!-- Top nav -->
    <header class="max-w-4xl mx-auto w-full flex items-center justify-between py-4">
        <a href="index.html" class="text-substackOrange text-2xl font-bold flex items-center space-x-2">
            <i class="fa-solid fa-book-bookmark"></i>
            <span class="text-white text-base tracking-tight font-extrabold">Substack</span>
        </a>
        <div class="flex items-center space-x-3 text-xs">
            <span data-i18n="auth.no_account">Chưa có tài khoản?</span>
            <a href="register.html" class="text-substackOrange font-semibold hover:underline" data-i18n="auth.register_now">Đăng ký ngay</a>
        </div>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-md mx-auto my-auto py-6">
        <div class="bg-sidebarBg border border-borderDark rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-substackOrange/10 border border-substackOrange/30 text-substackOrange rounded-2xl flex items-center justify-center mx-auto text-xl">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="login.heading">Đăng nhập vào tài khoản</h1>
                <p class="text-xs text-gray-400" data-i18n="login.subheading">Tham gia không gian đọc và viết độc lập chất lượng cao</p>
            </div>

            <!-- Banner Thông Báo Lỗi -->
            <div id="loginErrorAlert" class="hidden p-4 rounded-xl border text-xs space-y-1">
                <div class="flex items-center space-x-2 font-bold" id="errorTitle"></div>
                <div id="errorDesc" class="leading-relaxed"></div>
            </div>

            <form id="loginForm" class="space-y-4" onsubmit="event.preventDefault();">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5" data-i18n="auth.email">Địa chỉ Email</label>
                    <input type="text" id="emailInput" name="emailInput" placeholder="name@example.com" class="w-full bg-darkBg border border-borderDark rounded-xl px-4 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-substackOrange transition">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-semibold text-gray-300" data-i18n="auth.password">Mật khẩu</label>
                        <a href="#" onclick="Layout.showToast(I18n.t('login.forgot_toast'), 'info')" class="text-xs text-substackOrange hover:underline" data-i18n="login.forgot">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="passwordInput" name="passwordInput" placeholder="••••••••" class="w-full bg-darkBg border border-borderDark rounded-xl pl-4 pr-11 py-3 text-xs sm:text-sm text-white focus:outline-none focus:border-substackOrange transition">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-3 text-gray-400 hover:text-white text-sm" data-i18n-title="login.hide_password" title="Hiện/Ẩn mật khẩu">
                            <i id="passwordEyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" checked class="rounded bg-darkBg border-borderDark text-substackOrange">
                        <span data-i18n="login.remember">Ghi nhớ đăng nhập</span>
                    </label>
                </div>

                <button type="submit" id="loginSubmitBtn" class="w-full bg-substackOrange hover:bg-substackOrangeHover disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg text-xs sm:text-sm flex items-center justify-center space-x-2" data-i18n="login.submit">
                    <span>Đăng nhập ngay</span>
                </button>
            </form>

            <!-- Hộp chọn nhanh tài khoản thử nghiệm -->
            <div class="pt-4 border-t border-borderDark space-y-2">
                <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block text-center" data-i18n="login.quick_accounts">Hoặc chọn nhanh tài khoản thử:</span>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillDemoAccount('blogger')" class="bg-cardBg hover:bg-borderDark border border-borderDark p-2 rounded-xl text-left transition">
                        <p class="font-bold text-white text-[11px]" data-i18n="login.account_blogger">Blogger Hoàng Anh</p>
                        <p class="text-[10px] text-gray-400 truncate">hhoanganh0710@...</p>
                    </button>
                    <button type="button" onclick="fillDemoAccount('admin')" class="bg-cardBg hover:bg-borderDark border border-borderDark p-2 rounded-xl text-left transition">
                        <p class="font-bold text-white text-[11px]" data-i18n="login.account_admin">Admin Quản Trị</p>
                        <p class="text-[10px] text-gray-400 truncate">admin@substack.vn</p>
                    </button>
                    <button type="button" onclick="fillDemoAccount('user')" class="bg-cardBg hover:bg-borderDark border border-borderDark p-2 rounded-xl text-left transition">
                        <p class="font-bold text-white text-[11px]" data-i18n="login.account_user">User Đặng Mai Hoa</p>
                        <p class="text-[10px] text-gray-400 truncate">dangmaihoa@...</p>
                    </button>
                    <button type="button" onclick="fillDemoAccount('banned')" class="bg-red-950/40 hover:bg-red-950/60 border border-red-500/40 p-2 rounded-xl text-left transition">
                        <p class="font-bold text-red-300 text-[11px]" data-i18n="login.account_banned">Tài khoản bị Ban</p>
                        <p class="text-[10px] text-red-400 truncate">quangcao.spammer247@...</p>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-500 py-4" data-i18n="auth.footer">
        Substack Clone © 2026. Mọi quyền được bảo lưu.
    </footer>

    <!-- Scripts -->
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/validators.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        document.addEventListener('DOMContentLoaded', () => {
            I18n.ready(() => {
                fillDemoAccount('blogger');

                Validators.attach('#loginForm', {
                    emailInput: {
                        required: true,
                        email: true,
                        noHtml: true
                    },
                    passwordInput: {
                        required: true,
                        minLength: 6,
                        noHtml: true
                    }
                }, {
                    onSubmit: (values) => {
                        executeLogin(values.emailInput, values.passwordInput);
                    }
                });
            });
        });

        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('passwordEyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-substackOrange';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        function fillDemoAccount(type) {
            const emailInput = document.getElementById('emailInput');
            const passInput = document.getElementById('passwordInput');
            hideError();
            Validators.clearError(emailInput);
            Validators.clearError(passInput);

            if (type === 'blogger') {
                emailInput.value = 'hhoanganh0710@gmail.com';
                passInput.value = '12345678';
            } else if (type === 'admin') {
                emailInput.value = 'admin@substack.vn';
                passInput.value = 'admin123';
            } else if (type === 'user') {
                emailInput.value = 'dangmaihoa@gmail.com';
                passInput.value = 'user123';
            } else if (type === 'banned') {
                emailInput.value = 'quangcao.spammer247@gmail.com';
                passInput.value = 'spammer123';
            }
        }

        function setLoginLoading(isLoading) {
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = isLoading;
            btn.innerHTML = isLoading
                ? `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i><span>Đang xác thực...</span>`
                : `<span>${window.I18n ? I18n.t('login.submit', 'Đăng nhập ngay') : 'Đăng nhập ngay'}</span>`;
        }

        function showError(title, desc, level = 'warning') {
            const alert = document.getElementById('loginErrorAlert');
            const titleEl = document.getElementById('errorTitle');
            const descEl = document.getElementById('errorDesc');

            alert.classList.remove('hidden');
            if (level === 'danger') {
                alert.className = 'p-4 rounded-xl border bg-red-950/60 border-red-500/50 text-red-200 text-xs space-y-1';
                titleEl.innerHTML = '<i class="fa-solid fa-ban text-red-400"></i>';
            } else {
                alert.className = 'p-4 rounded-xl border bg-amber-950/60 border-amber-500/50 text-amber-200 text-xs space-y-1';
                titleEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
            }
            const titleText = document.createElement('span');
            titleText.textContent = title;
            titleEl.appendChild(titleText);
            descEl.innerHTML = desc;
        }

        function hideError() {
            document.getElementById('loginErrorAlert').classList.add('hidden');
        }

        async function executeLogin(emailVal, passVal) {
            const email = (emailVal || document.getElementById('emailInput').value).trim().toLowerCase();
            const password = (passVal || document.getElementById('passwordInput').value).trim();
            const passwordInput = document.getElementById('passwordInput');

            hideError();
            Validators.clearError(passwordInput);
            setLoginLoading(true);

            // 1. ƯU TIÊN GỌI BACKEND API XÁC THỰC MẬT KHẨU THẬT TỪ MYSQL
            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    signal: AbortSignal.timeout(3000)
                });

                const data = await res.json();

                // NẾU BACKEND BÁO SAI MẬT KHẨU HOẶC KHÔNG TÌM THẤY TÀI KHOẢN
                if (!res.ok || !data.success) {
                    setLoginLoading(false);
                    Validators.showError(passwordInput, data.message || 'Mật khẩu hoặc email không chính xác.');
                    showError('Đăng nhập thất bại', data.message || 'Mật khẩu hoặc email không chính xác.', 'warning');
                    passwordInput.focus();
                    passwordInput.select();
                    return; // DỪNG LUỒNG, TUYỆT ĐỐI KHÔNG CHO PHÉP ĐĂNG NHẬP
                }

                // XÁC THỰC THÀNH CÔNG VỚI MYSQL
                setLoginLoading(false);
                Layout.saveSession(data.user, data.token);
                Layout.showToast(window.I18n ? I18n.t('login.welcome_back', { name: data.user.display_name }) : `Chào mừng trở lại, ${data.user.display_name}!`, 'success');
                window.location.href = Layout.resolvePostLoginRedirect(data.user);
                return;

            } catch (networkError) {
                console.warn('Backend API offline hoặc CORS, chuyển sang chế độ kiểm tra MockData local:', networkError);
            }

            // 2. CHẾ ĐỘ DỰ PHÒNG CHỈ CHẠY KHI BACKEND HOÀN TOÀN MẤT KẾT NỐI
            const user = window.MockData?.users ? window.MockData.users.find(u => u.email.toLowerCase() === email) : null;

            if (!user) {
                setLoginLoading(false);
                Validators.showError(document.getElementById('emailInput'), 'Không tìm thấy tài khoản với email này.');
                showError('Tài khoản không tồn tại', 'Địa chỉ email này chưa được đăng ký.', 'warning');
                return;
            }

            // KIỂM TRA MẬT KHẨU BẮT BUỘC (Không cho qua nếu sai hoặc rỗng)
            const registeredUserLocal = JSON.parse(localStorage.getItem('registered_user') || '{}');
            const expectedPassword = user.password || (registeredUserLocal.email === email ? registeredUserLocal.password : null) || '12345678';

            if (password !== expectedPassword) {
                setLoginLoading(false);
                Validators.showError(passwordInput, 'Mật khẩu không chính xác.');
                showError('Sai mật khẩu', 'Mật khẩu bạn vừa nhập không đúng. Vui lòng thử lại.', 'warning');
                passwordInput.focus();
                passwordInput.select();
                return;
            }

            if (!user.is_active) {
                setLoginLoading(false);
                showError('Tài khoản bị tạm khóa', user.ban_reason || 'Tài khoản của bạn đã bị khóa do vi phạm tiêu chuẩn cộng đồng.', 'danger');
                return;
            }

            setLoginLoading(false);
            Layout.saveSession(user);
            Layout.showToast(`Chào mừng trở lại, ${user.display_name}!`, 'success');
            window.location.href = Layout.resolvePostLoginRedirect(user);
        }
    </script>
</body>
</html>
