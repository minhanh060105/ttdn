<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="search.page_title">Tìm kiếm & Khám phá bài viết | Substack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <!-- Khung chính -->
    <div class="flex flex-1 w-full">
        <!-- Sidebar trái -->
        <aside id="appSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-3xl w-full">
            
            <div class="space-y-6">
                <!-- Tiêu đề & Ô tìm kiếm lớn -->
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2" data-i18n="search.title">Tìm kiếm & Khám phá</h1>
                    <p class="text-xs sm:text-sm text-gray-400" data-i18n="search.subtitle">Khám phá các bài phân tích chuyên sâu, tác giả và chủ đề nổi bật trên toàn hệ thống.</p>
                </div>

                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Nhập từ khóa tìm kiếm (tiêu đề, nội dung, tên tác giả)..." data-i18n-placeholder="search.input_placeholder" class="w-full bg-sidebarBg border border-borderDark focus:border-substackOrange rounded-2xl pl-11 pr-24 py-3 text-sm text-white placeholder-gray-500 focus:outline-none shadow-md transition">
                    <button onclick="executeSearch()" class="absolute right-2 top-2 bg-substackOrange hover:bg-substackOrangeHover text-white px-4 py-1.5 rounded-xl text-xs font-semibold transition shadow" data-i18n="common.search">
                        Tìm kiếm
                    </button>
                </div>

                <!-- Chip Thẻ Tags để lọc nhanh -->
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 block mb-2" data-i18n="search.tags_label">Lọc theo chủ đề:</span>
                    <div id="searchTagChips" class="flex flex-wrap gap-2 text-xs">
                        <!-- Render tags qua JS -->
                    </div>
                </div>

                <!-- Chip Danh mục dùng chung từ MockData.categories -->
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 block mb-2" data-i18n="home.categories_label">Danh mục:</span>
                    <div id="searchCategoryChips" class="flex flex-wrap gap-2 text-xs">
                        <!-- Render categories qua JS -->
                    </div>
                </div>

                <!-- Thống kê kết quả -->
                <div class="flex items-center justify-between border-b border-borderDark pb-3">
                    <div id="searchResultStats" class="text-xs text-gray-400 font-medium" data-i18n="search.result_all">
                        Đang hiển thị tất cả bài viết đã xuất bản
                    </div>
                    <div class="flex items-center space-x-2 text-xs">
                        <span class="text-gray-500" data-i18n="search.sort_label">Sắp xếp:</span>
                        <select id="sortSelect" onchange="executeSearch()" class="bg-cardBg border border-borderDark rounded-lg px-2 py-1 text-gray-300 focus:outline-none">
                            <option value="newest" data-i18n="search.sort_newest">Mới nhất</option>
                            <option value="popular" data-i18n="search.sort_popular">Đọc nhiều nhất</option>
                        </select>
                    </div>
                </div>

                <!-- Danh sách kết quả -->
                <div id="searchResultsList" class="space-y-4">
                    <!-- Render qua JS -->
                </div>

                <!-- Phân trang tìm kiếm -->
                <div id="searchPaginationBar" class="pt-2"></div>
            </div>

        </main>
    </div>

    <!-- Bottom Nav Mobile -->
    <nav id="appBottomNav"></nav>

    <!-- Script & Mock Data -->
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/validators.js"></script>
    <script src="../assets/js/pagination.js"></script>
    <script src="../assets/js/sanitize.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        let selectedTagSlug = null;
        let selectedCategorySlug = null;

        document.addEventListener('DOMContentLoaded', () => {
            I18n.ready(() => {
                Layout.renderHeader('appHeader');
                Layout.renderSidebar('search', 'appSidebar');
                Layout.renderBottomNav('search', 'appBottomNav');

                // Đọc param ?q= hoặc ?tag= từ URL
                const urlParams = new URLSearchParams(window.location.search);
                const initialQuery = urlParams.get('q') || '';
                const initialTag = urlParams.get('tag') || null;
                const initialCategory = urlParams.get('category') || null;

                if (initialQuery) {
                    document.getElementById('searchInput').value = initialQuery;
                }
                selectedTagSlug = initialTag;
                selectedCategorySlug = initialCategory;

                renderTagChips();
                renderCategoryChips();
                executeSearch(false);

                // Enter để search
                document.getElementById('searchInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') executeSearch();
                });

                window.addEventListener('demoStateChanged', () => {
                    executeSearch();
                });
            });
        });

        function renderTagChips() {
            const container = document.getElementById('searchTagChips');
            if (!container || !MockData.tags) return;

            container.innerHTML = `
                <button onclick="toggleTagFilter(null)" class="px-3 py-1.5 rounded-full border ${!selectedTagSlug ? 'bg-substackOrange border-substackOrange text-white' : 'bg-cardBg border-borderDark text-gray-300 hover:border-substackOrange'} transition font-medium">
                    ${Layout.escapeHtml(I18n.t('common.all'))}
                </button>
                ${MockData.tags.map(t => `
                    <button onclick="toggleTagFilter('${t.slug}')" class="px-3 py-1.5 rounded-full border ${selectedTagSlug === t.slug ? 'bg-substackOrange border-substackOrange text-white' : 'bg-cardBg border-borderDark text-gray-300 hover:border-substackOrange'} transition font-medium">
                        # ${Layout.escapeHtml(t.name)}
                    </button>
                `).join('')}
            `;
        }

        function toggleTagFilter(slug) {
            selectedTagSlug = slug;
            renderTagChips();
            executeSearch();
        }

        function categoryChipClass(slug) {
            return slug === selectedCategorySlug
                ? 'px-3 py-1.5 rounded-full border border-substackOrange bg-substackOrange text-white transition font-medium'
                : 'px-3 py-1.5 rounded-full border border-borderDark bg-cardBg text-gray-300 hover:border-substackOrange transition font-medium';
        }

        function renderCategoryChips() {
            const container = document.getElementById('searchCategoryChips');
            if (!container || !MockData.categories) return;

            const activeCategories = MockData.categories.filter(c => c.is_active);
            container.innerHTML = `
                <button onclick="toggleCategoryFilter(null)" class="${categoryChipClass(null)}">
                    ${Layout.escapeHtml(I18n.t('common.all_categories'))}
                </button>
                ${activeCategories.map(c => `
                    <button onclick="toggleCategoryFilter('${c.slug}')" class="${categoryChipClass(c.slug)}">
                        ${Layout.escapeHtml(c.name)}
                    </button>
                `).join('')}
            `;
        }

        function toggleCategoryFilter(slug) {
            selectedCategorySlug = slug;
            renderCategoryChips();
            executeSearch();
        }

        function executeSearch(resetPage = true) {
            const state = Layout.getDemoState();
            const container = document.getElementById('searchResultsList');
            const paginationBar = document.getElementById('searchPaginationBar');
            const stats = document.getElementById('searchResultStats');
            const searchInputEl = document.getElementById('searchInput');

            // Kiểm tra thẻ HTML bằng Validators
            const htmlErr = Validators.validateField(searchInputEl, { noHtml: true });
            if (htmlErr) {
                searchInputEl.focus();
                return;
            }

            // Truy vấn mới luôn quay về trang 1
            if (resetPage) {
                const url = new URL(window.location.href);
                if (url.searchParams.has('page')) {
                    url.searchParams.delete('page');
                    window.history.replaceState({}, '', url.toString());
                }
            }

            const query = (searchInputEl.value || '').trim().toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            // 1. Loading
            if (state === 'loading') {
                if (paginationBar) paginationBar.innerHTML = '';
                stats.textContent = I18n.t('search.loading');
                container.innerHTML = Array(3).fill(0).map(() => `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-5 space-y-3 animate-pulse">
                        <div class="w-1/2 h-5 bg-borderDark rounded"></div>
                        <div class="w-full h-12 bg-borderDark rounded"></div>
                        <div class="w-1/4 h-3 bg-borderDark rounded"></div>
                    </div>
                `).join('');
                return;
            }

            // 2. Error
            if (state === 'error') {
                if (paginationBar) paginationBar.innerHTML = '';
                stats.textContent = I18n.t('search.error_stats');
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-rose-900/40 rounded-2xl p-8 text-center space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-3xl"></i>
                        <h3 class="text-sm font-bold text-white">${Layout.escapeHtml(I18n.t('search.error_title'))}</h3>
                        <p class="text-xs text-gray-400">${Layout.escapeHtml(I18n.t('search.error_desc'))}</p>
                        <button onclick="Layout.setDemoState('normal')" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-4 py-2 rounded-lg">${Layout.escapeHtml(I18n.t('common.retry'))}</button>
                    </div>
                `;
                return;
            }

            // Lọc posts
            let results = MockData.posts.filter(p => p.status === 'published' && !p.deleted_at);

            // 3. Demo Empty
            if (state === 'empty') {
                results = [];
            } else {
                // Lọc theo tag
                if (selectedTagSlug) {
                    const tagObj = MockData.tags.find(t => t.slug === selectedTagSlug);
                    if (tagObj) {
                        const postIdsWithTag = MockData.post_tags.filter(pt => pt.tag_id === tagObj.id).map(pt => pt.post_id);
                        results = results.filter(p => postIdsWithTag.includes(p.id));
                    }
                }

                // Lọc theo danh mục đang hoạt động
                if (selectedCategorySlug) {
                    const catObj = MockData.categories.find(c => c.slug === selectedCategorySlug && c.is_active);
                    if (catObj) {
                        results = results.filter(p => p.category_id === catObj.id);
                    }
                }

                // Lọc theo từ khóa tìm kiếm
                if (query) {
                    results = results.filter(p => {
                        const author = MockData.users.find(u => u.id === p.author_id);
                        const authorName = author ? author.display_name.toLowerCase() : '';
                        const authorHandle = author ? author.handle.toLowerCase() : '';
                        return p.title.toLowerCase().includes(query) ||
                               Sanitize.text(p.content_html || '').toLowerCase().includes(query) ||
                               authorName.includes(query) ||
                               authorHandle.includes(query);
                    });
                }

                // Sắp xếp
                if (sortBy === 'popular') {
                    results.sort((a, b) => b.views_count - a.views_count);
                } else {
                    results.sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
                }
            }

            // Trạng thái Rỗng
            if (results.length === 0) {
                if (paginationBar) paginationBar.innerHTML = '';
                stats.textContent = I18n.t('search.zero_results');
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-10 text-center space-y-3">
                        <div class="w-12 h-12 bg-borderDark/60 text-gray-400 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <h3 class="text-sm font-bold text-white">${Layout.escapeHtml(I18n.t('search.empty_title'))}</h3>
                        <p class="text-xs text-gray-400 max-w-sm mx-auto">${Layout.escapeHtml(I18n.t('search.empty_desc'))}</p>
                        <button onclick="resetSearch()" class="text-xs text-substackOrange font-medium hover:underline inline-block mt-2">
                            ${Layout.escapeHtml(I18n.t('search.empty_clear'))}
                        </button>
                    </div>
                `;
                return;
            }

            stats.textContent = I18n.t('search.results_count', { count: results.length });

            Pagination.render({
                container: paginationBar,
                items: results,
                pageSize: 10,
                pageSizeOptions: [10, 20, 50],
                syncUrl: true,
                onPageChange: (pagedResults) => {
                    container.innerHTML = pagedResults.map(post => {
                        const author = MockData.users.find(u => u.id === post.author_id) || {
                            display_name: I18n.t('common.author'),
                            handle: 'author',
                            avatar_url: 'https://i.pravatar.cc/150'
                        };
                        const postTagIds = MockData.post_tags.filter(pt => pt.post_id === post.id).map(pt => pt.tag_id);
                        const postTags = MockData.tags.filter(t => postTagIds.includes(t.id));
                        const postCategory = post.category_id ? MockData.getCategoryById(post.category_id) : null;
                        const excerpt = Sanitize.text(post.content_html || '');

                        return `
                            <div class="bg-sidebarBg border border-borderDark hover:border-gray-600 rounded-2xl p-4 sm:p-5 transition shadow-sm space-y-3">
                                <div class="flex items-center space-x-2.5">
                                    <img src="${Layout.escapeHtml(author.avatar_url)}" alt="${Layout.escapeHtml(author.display_name)}" class="w-7 h-7 rounded-full object-cover">
                                    <span class="text-xs font-bold text-white">${Layout.escapeHtml(author.display_name)}</span>
                                    <span class="text-xs text-gray-500">•</span>
                                    <span class="text-[11px] text-gray-400">${Layout.formatDate(post.published_at)}</span>
                                </div>

                                <a href="post-detail.html?slug=${encodeURIComponent(post.slug)}" class="block group">
                                    <h3 class="text-base font-bold text-white group-hover:text-substackOrange transition line-clamp-2 leading-snug">
                                        ${Layout.escapeHtml(post.title)}
                                    </h3>
                                    <p class="text-xs sm:text-sm text-gray-300 line-clamp-2 mt-1 leading-relaxed">
                                        ${Layout.escapeHtml(excerpt)}
                                    </p>
                                </a>

                                <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                                    <div class="flex items-center space-x-1.5 flex-wrap">
                                        ${postCategory ? `
                                            <span class="bg-substackOrange/15 border border-substackOrange/40 px-2 py-0.5 rounded-full text-[10px] text-substackOrange font-semibold">
                                                <i class="fa-regular fa-folder-open mr-1"></i>${Layout.escapeHtml(postCategory.name)}
                                            </span>
                                        ` : ''}
                                        ${postTags.map(t => `
                                            <span class="bg-cardBg border border-borderDark px-2 py-0.5 rounded-full text-[10px] text-gray-300">
                                                # ${Layout.escapeHtml(t.name)}
                                            </span>
                                        `).join('')}
                                    </div>
                                    <span class="text-[11px] text-gray-500">
                                        <i class="fa-regular fa-eye mr-1"></i>${Layout.formatNumber(post.views_count)}
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            });
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            selectedTagSlug = null;
            selectedCategorySlug = null;
            renderTagChips();
            renderCategoryChips();
            executeSearch();
        }
    </script>
</body>
</html>
