<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="notes.page_title">Ghi chú của tôi | Substack Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 w-full">
        <!-- Sidebar trái -->
        <aside id="appSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-3xl w-full space-y-6">
            
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                    <i class="fa-regular fa-note-sticky text-substackOrange"></i>
                    <span data-i18n="notes.title">Ghi chú của tôi</span>
                </h1>
                <p class="text-xs text-gray-400 mt-1" data-i18n="notes.subtitle">Xuất bản các ý tưởng ngắn, cập nhật tức thì tới những người theo dõi bạn.</p>
            </div>

            <!-- Khối tạo ghi chú nhanh -->
            <form id="quickNoteForm" class="bg-sidebarBg border border-borderDark rounded-2xl p-5 shadow-sm space-y-3" novalidate>
                <div class="flex items-start space-x-3">
                    <img id="myNoteAvatar" src="https://i.pravatar.cc/150?u=hhoanganh0710" alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-borderDark flex-shrink-0">
                    <div class="flex-1 space-y-2">
                        <textarea id="noteContentInput" name="noteContentInput" oninput="updateCharCount(this.value)" rows="3" maxlength="280" placeholder="Bạn đang nghĩ gì? Hãy chia sẻ suy nghĩ ngắn tới độc giả..." data-i18n-placeholder="notes.composer_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-substackOrange resize-none"></textarea>
                        
                        <!-- Nhập ảnh tùy chọn -->
                        <div id="noteImageInputRow" class="hidden flex items-center space-x-2">
                            <i class="fa-regular fa-image text-gray-400 text-xs"></i>
                            <input type="url" id="noteImageUrlInput" name="noteImageUrlInput" placeholder="Dán link ảnh (https://...)" data-i18n-placeholder="notes.image_placeholder" class="flex-1 bg-darkBg border border-borderDark rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-substackOrange">
                            <button type="button" onclick="toggleImageInput(false)" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-borderDark">
                    <div class="flex items-center space-x-3 text-xs text-gray-400">
                        <button type="button" onclick="toggleImageInput(true)" class="hover:text-substackOrange transition flex items-center space-x-1">
                            <i class="fa-regular fa-image"></i>
                            <span data-i18n="notes.add_image">Thêm ảnh</span>
                        </button>
                        <span id="charCountDisplay" class="text-[11px] text-gray-500">0 / 280 ký tự</span>
                    </div>

                    <button type="submit" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-5 py-2 rounded-xl transition shadow" data-i18n="notes.publish">
                        Đăng ghi chú
                    </button>
                </div>
            </form>

            <!-- Danh sách ghi chú của tôi -->
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-borderDark pb-2">
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider" data-i18n="notes.history_heading">Lịch sử ghi chú đã đăng</h2>
                    <span id="myNotesCountBadge" class="text-xs text-gray-400"></span>
                </div>

                <div id="myNotesContainer" class="space-y-4">
                    <!-- Render qua JS -->
                </div>

                <!-- Phân trang ghi chú -->
                <div id="myNotesPaginationBar" class="pt-2"></div>
            </div>

        </main>
    </div>

    <!-- Modal sửa ghi chú -->
    <div id="editNoteModal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-sidebarBg border border-borderDark rounded-2xl w-full max-w-md p-6 relative shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-borderDark pb-3">
                <h3 class="font-bold text-white text-sm" data-i18n="notes.edit_title">Chỉnh sửa ghi chú</h3>
                <button type="button" onclick="closeEditNoteModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="editNoteForm" class="space-y-3" novalidate>
                <textarea id="editNoteContent" name="editNoteContent" rows="4" maxlength="280" placeholder="Nội dung ghi chú..." data-i18n-placeholder="notes.edit_placeholder" class="w-full bg-darkBg border border-borderDark rounded-xl p-3 text-xs text-white focus:outline-none focus:border-substackOrange"></textarea>
                <div>
                    <label class="block text-xs text-gray-400 mb-1" for="editNoteImageUrl" data-i18n="notes.image_label">Link ảnh:</label>
                    <input type="url" id="editNoteImageUrl" name="editNoteImageUrl" class="w-full bg-darkBg border border-borderDark rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-substackOrange">
                </div>
                <div class="flex justify-end space-x-2 pt-2 border-t border-borderDark">
                    <button type="button" onclick="closeEditNoteModal()" class="px-4 py-2 bg-cardBg text-gray-300 text-xs rounded-xl hover:bg-borderDark" data-i18n="common.cancel">Hủy</button>
                    <button type="submit" class="px-5 py-2 bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold rounded-xl shadow" data-i18n="notes.save">Lưu cập nhật</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Nav Mobile -->
    <nav id="appBottomNav"></nav>

    <!-- Script & Mock Data -->
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/validators.js"></script>
    <script src="../assets/js/pagination.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        let editingNoteId = null;
        let quickNoteValidator = null;
        let editNoteValidator = null;

        document.addEventListener('DOMContentLoaded', () => {
            I18n.ready(() => {
                Layout.renderHeader('appHeader');
                Layout.renderSidebar('my-notes', 'appSidebar');
                Layout.renderBottomNav('', 'appBottomNav');

                const user = Layout.getCurrentUser();
                const avatarEl = document.getElementById('myNoteAvatar');
                if (user?.avatar_url) {
                    avatarEl.src = user.avatar_url;
                }
                avatarEl.alt = I18n.t('notes.avatar_alt');

                quickNoteValidator = Validators.attach('#quickNoteForm', {
                    noteContentInput: {
                        required: true,
                        maxLength: 280
                    },
                    noteImageUrlInput: {}
                }, {
                    onSubmit: (values) => publishQuickNote(values)
                });

                editNoteValidator = Validators.attach('#editNoteForm', {
                    editNoteContent: {
                        required: true,
                        maxLength: 280
                    },
                    editNoteImageUrl: {}
                }, {
                    onSubmit: (values) => saveEditNote(values)
                });

                updateCharCount('');
                renderNotesList();

                window.addEventListener('demoStateChanged', () => {
                    renderNotesList();
                });
            });
        });

        function updateCharCount(val) {
            const display = document.getElementById('charCountDisplay');
            display.textContent = I18n.t('notes.char_count', { count: val.length, max: 280 });
            if (val.length >= 260) {
                display.className = "text-[11px] text-amber-400 font-bold";
            } else {
                display.className = "text-[11px] text-gray-500";
            }
        }

        function toggleImageInput(show) {
            const row = document.getElementById('noteImageInputRow');
            if (show) row.classList.remove('hidden');
            else {
                row.classList.add('hidden');
                document.getElementById('noteImageUrlInput').value = '';
            }
        }

        function publishQuickNote(values) {
            const content = (values.noteContentInput || '').trim();
            const imageUrl = (values.noteImageUrlInput || '').trim();

            const currentUser = Layout.getCurrentUser();
            const newNote = {
                id: Date.now(),
                author_id: currentUser ? currentUser.id : 3,
                content: content,
                image_url: imageUrl || null,
                created_at: new Date().toISOString()
            };

            MockData.notes.unshift(newNote);
            const contentEl = document.getElementById('noteContentInput');
            contentEl.value = '';
            toggleImageInput(false);
            updateCharCount('');
            if (quickNoteValidator) quickNoteValidator.clear();
            Layout.showToast(I18n.t('notes.published'), 'success');
            renderNotesList();
        }

        function renderNotesList() {
            const state = Layout.getDemoState();
            const container = document.getElementById('myNotesContainer');
            const paginationBar = document.getElementById('myNotesPaginationBar');
            const currentUser = Layout.getCurrentUser();
            const authorId = currentUser ? currentUser.id : 3;

            // 1. Loading
            if (state === 'loading') {
                if (paginationBar) paginationBar.innerHTML = '';
                container.innerHTML = Array(2).fill(0).map(() => `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-5 space-y-3 animate-pulse">
                        <div class="w-1/3 h-4 bg-borderDark rounded"></div>
                        <div class="w-full h-12 bg-borderDark rounded"></div>
                    </div>
                `).join('');
                return;
            }

            // 2. Error
            if (state === 'error') {
                if (paginationBar) paginationBar.innerHTML = '';
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-rose-900/40 rounded-2xl p-8 text-center space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-3xl"></i>
                        <h3 class="text-sm font-bold text-white">${Layout.escapeHtml(I18n.t('notes.error_title'))}</h3>
                        <p class="text-xs text-gray-400">${Layout.escapeHtml(I18n.t('notes.load_error'))}</p>
                        <button onclick="Layout.setDemoState('normal')" class="bg-substackOrange text-white text-xs px-4 py-2 rounded-lg">${Layout.escapeHtml(I18n.t('common.retry'))}</button>
                    </div>
                `;
                return;
            }

            let notes = MockData.notes.filter(n => n.author_id === authorId);

            // 3. Demo Empty
            if (state === 'empty') notes = [];

            document.getElementById('myNotesCountBadge').textContent = I18n.t('notes.count', { count: notes.length });

            if (notes.length === 0) {
                if (paginationBar) paginationBar.innerHTML = '';
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-10 text-center space-y-2">
                        <i class="fa-regular fa-note-sticky text-3xl text-gray-500"></i>
                        <h3 class="text-sm font-bold text-white">${Layout.escapeHtml(I18n.t('notes.empty_title'))}</h3>
                        <p class="text-xs text-gray-400">${Layout.escapeHtml(I18n.t('notes.empty_desc'))}</p>
                    </div>
                `;
                return;
            }

            Pagination.render({
                container: paginationBar,
                items: notes,
                pageSize: 10,
                pageSizeOptions: [10, 20, 50],
                syncUrl: true,
                onPageChange: (pagedNotes) => {
                    container.innerHTML = pagedNotes.map(note => `
                        <div class="bg-sidebarBg border border-borderDark rounded-2xl p-4 sm:p-5 space-y-3 shadow-sm" id="note-card-${note.id}">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs text-gray-400">${Layout.formatDate(note.created_at)}</span>
                                </div>
                                <div class="flex items-center space-x-2 text-xs">
                                    <button onclick="openEditNote(${note.id})" class="px-2.5 py-1 bg-cardBg hover:bg-borderDark text-gray-300 rounded-lg border border-borderDark">
                                        <i class="fa-regular fa-pen-to-square mr-1"></i> ${Layout.escapeHtml(I18n.t('common.edit'))}
                                    </button>
                                    <button onclick="deleteNote(${note.id})" class="px-2.5 py-1 bg-cardBg hover:bg-red-950/60 text-gray-400 hover:text-red-400 rounded-lg border border-borderDark">
                                        <i class="fa-regular fa-trash-can mr-1"></i> ${Layout.escapeHtml(I18n.t('notes.delete'))}
                                    </button>
                                </div>
                            </div>

                            <p class="text-xs sm:text-sm text-gray-200 leading-relaxed">${Layout.escapeHtml(note.content)}</p>

                            ${note.image_url ? `
                                <div class="rounded-xl overflow-hidden max-h-60 border border-borderDark">
                                    <img src="${Layout.escapeHtml(note.image_url)}" alt="${Layout.escapeHtml(I18n.t('notes.note_image_alt'))}" class="w-full h-full object-cover">
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                }
            });
        }

        function openEditNote(id) {
            const note = MockData.notes.find(n => n.id === id);
            if (!note) return;
            editingNoteId = id;
            document.getElementById('editNoteContent').value = note.content;
            document.getElementById('editNoteImageUrl').value = note.image_url || '';
            if (editNoteValidator) editNoteValidator.clear();
            document.getElementById('editNoteModal').classList.remove('hidden');
        }

        function closeEditNoteModal() {
            document.getElementById('editNoteModal').classList.add('hidden');
            editingNoteId = null;
        }

        function saveEditNote(values) {
            const note = MockData.notes.find(n => n.id === editingNoteId);
            if (note) {
                note.content = (values.editNoteContent || '').trim();
                note.image_url = (values.editNoteImageUrl || '').trim() || null;
                closeEditNoteModal();
                Layout.showToast(I18n.t('notes.updated'), 'success');
                renderNotesList();
            }
        }

        function deleteNote(id) {
            Layout.showConfirmModal({
                title: I18n.t('notes.delete_title'),
                message: I18n.t('notes.delete_message'),
                confirmText: I18n.t('common.delete'),
                onConfirm: () => {
                    const idx = MockData.notes.findIndex(n => n.id === id);
                    if (idx !== -1) {
                        MockData.notes.splice(idx, 1);
                        Layout.showToast(I18n.t('notes.deleted'), 'success');
                        renderNotesList();
                    }
                }
            });
        }
    </script>
</body>
</html>
