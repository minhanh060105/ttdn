<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="tag.page_title">Chuyên mục Thẻ | Substack</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 w-full">
        <!-- Sidebar trái -->
        <aside id="appSidebar"></aside>

        <!-- Main content -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-3xl w-full space-y-6">
            
            <!-- Header thông tin Thẻ -->
            <div id="tagHeaderBox" class="bg-sidebarBg border border-borderDark rounded-2xl p-6 shadow-sm">
                <!-- Render qua JS -->
            </div>

            <!-- Lọc theo danh mục (dùng chung MockData.categories) -->
            <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400 block mb-2" data-i18n="home.categories_label">Danh mục:</span>
                <div id="tagCategoryChips" class="flex flex-wrap gap-2 text-xs">
                    <!-- Render categories qua JS -->
                </div>
            </div>

            <!-- Danh sách bài viết theo Thẻ -->
            <div id="tagPostList" class="space-y-4">
                <!-- Render qua JS -->
            </div>

            <!-- Phân trang theo Thẻ -->
            <div id="tagPaginationBar" class="pt-2"></div>

        </main>
    </div>

    <!-- Bottom Nav Mobile -->
    <nav id="appBottomNav"></nav>

    <!-- Script & Mock Data -->
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/pagination.js"></script>
    <script src="../assets/js/sanitize.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        let selectedCategorySlug = null;

        document.addEventListener('DOMContentLoaded', () => {
            I18n.ready(() => {
                Layout.renderHeader('appHeader');
                Layout.renderSidebar('tag', 'appSidebar');
                Layout.renderBottomNav('tag', 'appBottomNav');

                const urlParams = new URLSearchParams(window.location.search);
                selectedCategorySlug = urlParams.get('category') || null;
                renderTagCategoryChips();
                renderTagPage();

                window.addEventListener('demoStateChanged', () => {
                    renderTagPage();
                });
            });
        });

        function categoryChipClass(slug) {
            return slug === selectedCategorySlug
                ? 'px-3 py-1.5 rounded-full border border-substackOrange bg-substackOrange text-white font-medium transition'
                : 'px-3 py-1.5 rounded-full border border-borderDark bg-cardBg text-gray-300 hover:border-substackOrange font-medium transition';
        }

        function renderTagCategoryChips() {
            const container = document.getElementById('tagCategoryChips');
            if (!container || !MockData.categories) return;

            const activeCategories = MockData.categories.filter(c => c.is_active);
            container.innerHTML = `
                <button onclick="filterTagByCategory(null)" class="${categoryChipClass(null)}">
                    ${Layout.escapeHtml(I18n.t('common.all_categories'))}
                </button>
                ${activeCategories.map(c => `
                    <button onclick="filterTagByCategory('${c.slug}')" class="${categoryChipClass(c.slug)}">
                        ${Layout.escapeHtml(c.name)}
                    </button>
                `).join('')}
            `;
        }

        function filterTagByCategory(slug) {
            selectedCategorySlug = slug;
            renderTagCategoryChips();
            renderTagPage();
        }

        function renderTagPage() {
            const state = Layout.getDemoState();
            const headerBox = document.getElementById('tagHeaderBox');
            const listContainer = document.getElementById('tagPostList');
            const paginationBar = document.getElementById('tagPaginationBar');
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug') || 'cong-nghe';

            // 1. Loading
            if (state === 'loading') {
                if (paginationBar) paginationBar.innerHTML = '';
                headerBox.innerHTML = `
                    <div class="animate-pulse space-y-3">
                        <div class="w-32 h-6 bg-borderDark rounded"></div>
                        <div class="w-64 h-4 bg-borderDark rounded"></div>
                    </div>
                `;
                listContainer.innerHTML = Array(3).fill(0).map(() => `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-5 space-y-3 animate-pulse">
                        <div class="w-2/3 h-5 bg-borderDark rounded"></div>
                        <div class="w-full h-12 bg-borderDark rounded"></div>
                    </div>
                `).join('');
                return;
            }

            // 2. Error
            if (state === 'error') {
                if (paginationBar) paginationBar.innerHTML = '';
                headerBox.innerHTML = `<h2 class="text-lg font-bold text-rose-400">${Layout.escapeHtml(I18n.t('tag.error_header'))}</h2>`;
                listContainer.innerHTML = `
                    <div class="bg-sidebarBg border border-rose-900/40 rounded-2xl p-8 text-center space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-3xl"></i>
                        <h3 class="text-sm font-bold text-white">${Layout.escapeHtml(I18n.t('tag.error_title'))}</h3>
                        <p class="text-xs text-gray-400">${Layout.escapeHtml(I18n.t('tag.error_desc'))}</p>
                        <button onclick="Layout.setDemoState('normal')" class="bg-substackOrange text-white text-xs px-4 py-2 rounded-lg">${Layout.escapeHtml(I18n.t('common.retry'))}</button>
                    </div>
                `;
                return;
            }

            const tag = MockData.tags.find(t => t.slug === slug);
            if (!tag) {
                if (paginationBar) paginationBar.innerHTML = '';
                headerBox.innerHTML = `
                    <div class="text-center py-4">
                        <h1 class="text-xl font-bold text-white mb-2">${Layout.escapeHtml(I18n.t('tag.not_found_title'))}</h1>
                        <p class="text-xs text-gray-400">${Layout.escapeHtml(I18n.t('tag.not_found_desc'))}</p>
                    </div>
                `;
                listContainer.innerHTML = '';
                return;
            }

            // Tìm bài viết có tag này
            const postIds = MockData.post_tags.filter(pt => pt.tag_id === tag.id).map(pt => pt.post_id);
            let posts = MockData.posts.filter(p => postIds.includes(p.id) && p.status === 'published' && !p.deleted_at);

            // Lọc thêm theo danh mục đang hoạt động
            if (selectedCategorySlug) {
                const matchedCategory = MockData.categories.find(c => c.slug === selectedCategorySlug && c.is_active);
                if (matchedCategory) {
                    posts = posts.filter(p => p.category_id === matchedCategory.id);
                }
            }

            // 3. Demo Empty
            if (state === 'empty') posts = [];

            // Header info
            headerBox.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="space-y-1.5">
                        <div class="flex items-center space-x-2">
                            <span class="w-8 h-8 rounded-xl bg-substackOrange/10 border border-substackOrange/30 text-substackOrange flex items-center justify-center font-bold">#</span>
                            <h1 class="text-2xl font-extrabold text-white">${Layout.escapeHtml(tag.name)}</h1>
                        </div>
                        <p class="text-xs text-gray-400 max-w-md leading-relaxed">${Layout.escapeHtml(tag.description || I18n.t('tag.description', { name: tag.name }))}</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="bg-darkBg border border-borderDark px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-300">
                            ${Layout.escapeHtml(I18n.t('tag.posts_count', { count: posts.length }))}
                        </span>
                        <a href="search.html" class="bg-cardBg hover:bg-borderDark border border-borderDark text-xs text-gray-300 px-3 py-1.5 rounded-xl transition">
                            ${Layout.escapeHtml(I18n.t('tag.all_tags'))}
                        </a>
                    </div>
                </div>
            `;

            // List posts
            if (posts.length === 0) {
                if (paginationBar) paginationBar.innerHTML = '';
                listContainer.innerHTML = `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-10 text-center space-y-3">
                        <i class="fa-regular fa-folder-open text-3xl text-gray-500"></i>
                        <h3 class="text-sm font-bold text-white">${Layout.escapeHtml(I18n.t('tag.empty_title'))}</h3>
                        <p class="text-xs text-gray-400 max-w-sm mx-auto">${Layout.escapeHtml(I18n.t('tag.empty_desc'))}</p>
                        <a href="index.html" class="inline-block mt-2 text-xs text-substackOrange hover:underline font-medium">${Layout.escapeHtml(I18n.t('tag.back_home'))}</a>
                    </div>
                `;
                return;
            }

            Pagination.render({
                container: paginationBar,
                items: posts,
                pageSize: 10,
                pageSizeOptions: [10, 20, 50],
                syncUrl: true,
                onPageChange: (pagedPosts) => {
                    listContainer.innerHTML = pagedPosts.map(post => {
                        const author = MockData.users.find(u => u.id === post.author_id) || {
                            display_name: I18n.t('common.author'),
                            handle: 'author',
                            avatar_url: 'https://i.pravatar.cc/150'
                        };
                        const excerpt = Sanitize.text(post.content_html || '');
                        const category = post.category_id ? MockData.getCategoryById(post.category_id) : null;

                        return `
                            <article class="bg-sidebarBg border border-borderDark hover:border-gray-600 rounded-2xl p-4 sm:p-5 transition shadow-sm space-y-3">
                                <div class="flex items-center space-x-2.5">
                                    <img src="${Layout.escapeHtml(author.avatar_url)}" alt="${Layout.escapeHtml(author.display_name)}" class="w-7 h-7 rounded-full object-cover">
                                    <span class="text-xs font-bold text-white">${Layout.escapeHtml(author.display_name)}</span>
                                    <span class="text-xs text-gray-500">•</span>
                                    <span class="text-[11px] text-gray-400">${Layout.formatDate(post.published_at)}</span>
                                </div>

                                <a href="post-detail.html?slug=${encodeURIComponent(post.slug)}" class="block group">
                                    <h3 class="text-base font-bold text-white group-hover:text-substackOrange transition line-clamp-2 leading-snug">
                                        ${Layout.escapeHtml(post.title)}
                                    </h3>
                                    <p class="text-xs sm:text-sm text-gray-300 line-clamp-2 mt-1 leading-relaxed">
                                        ${Layout.escapeHtml(excerpt)}
                                    </p>
                                </a>

                                <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                                    <div class="flex items-center space-x-2 flex-wrap">
                                        ${category ? `
                                            <span class="text-[10px] text-substackOrange bg-substackOrange/15 border border-substackOrange/40 px-2 py-0.5 rounded-full font-semibold">
                                                <i class="fa-regular fa-folder-open mr-1"></i>${Layout.escapeHtml(category.name)}
                                            </span>
                                        ` : ''}
                                        <span class="text-[11px] text-gray-500">
                                            <i class="fa-regular fa-eye mr-1"></i>${Layout.escapeHtml(I18n.t('home.views', { count: Layout.formatNumber(post.views_count) }))}
                                        </span>
                                    </div>
                                    <a href="post-detail.html?slug=${encodeURIComponent(post.slug)}" class="text-substackOrange hover:underline font-medium">
                                        ${Layout.escapeHtml(I18n.t('tag.read'))} <i class="fa-solid fa-arrow-right text-[10px] ml-1"></i>
                                    </a>
                                </div>
                            </article>
                        `;
                    }).join('');
                }
            });
        }
    </script>
</body>
</html>
