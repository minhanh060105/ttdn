<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết của tôi | Substack Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <!-- Header dùng chung -->
    <header id="appHeader"></header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full">
        <!-- Sidebar trái -->
        <aside id="appSidebar"></aside>

        <!-- Main content Blogger -->
        <main class="flex-1 px-4 sm:px-8 py-6 max-w-5xl mx-auto w-full space-y-6">
            
            <!-- Header bài viết của tôi -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                        <i class="fa-solid fa-newspaper text-substackOrange"></i>
                        <span>Quản lý bài viết của tôi</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-1">Theo dõi trạng thái kiểm duyệt, chỉnh sửa bản nháp và xuất bản các bài viết chuyên sâu.</p>
                </div>
                <a href="post-editor.html?new=true" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow flex items-center space-x-2 self-start sm:self-auto">
                    <i class="fa-solid fa-plus"></i>
                    <span>Tạo bài viết mới</span>
                </a>
            </div>

            <!-- Tab lọc theo 4 trạng thái: Tất cả / Đã đăng (published) / Chờ duyệt (pending) / Bản nháp (draft) / Bị từ chối (rejected) -->
            <div class="flex space-x-2 border-b border-borderDark pb-2 overflow-x-auto text-xs font-semibold">
                <button onclick="filterStatus('all')" id="tab-all" class="px-3.5 py-2 rounded-xl bg-substackOrange text-white transition">
                    Tất cả (<span id="count-all">0</span>)
                </button>
                <button onclick="filterStatus('published')" id="tab-published" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Đã đăng (<span id="count-published">0</span>)
                </button>
                <button onclick="filterStatus('pending')" id="tab-pending" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Chờ duyệt (<span id="count-pending">0</span>)
                </button>
                <button onclick="filterStatus('draft')" id="tab-draft" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Bản nháp (<span id="count-draft">0</span>)
                </button>
                <button onclick="filterStatus('rejected')" id="tab-rejected" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Bị từ chối (<span id="count-rejected">0</span>)
                </button>
            </div>

            <!-- Danh sách bài viết dạng bảng / thẻ -->
            <div id="myPostsListContainer" class="space-y-4">
                <!-- Render qua JS -->
            </div>

        </main>
    </div>

    <!-- Bottom Nav Mobile -->
    <nav id="appBottomNav"></nav>

    <!-- Script & Mock Data -->
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        let currentStatusFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderHeader('appHeader');
            Layout.renderSidebar('my-posts', 'appSidebar');
            Layout.renderBottomNav('', 'appBottomNav');

            renderMyPosts();

            window.addEventListener('demoStateChanged', () => {
                renderMyPosts();
            });
        });

        function filterStatus(status) {
            currentStatusFilter = status;
            ['all', 'published', 'pending', 'draft', 'rejected'].forEach(s => {
                const btn = document.getElementById(`tab-${s}`);
                if (btn) {
                    if (s === status) {
                        btn.className = "px-3.5 py-2 rounded-xl bg-substackOrange text-white transition font-semibold";
                    } else {
                        btn.className = "px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition font-medium";
                    }
                }
            });
            renderMyPosts();
        }

        function renderMyPosts() {
            const state = Layout.getDemoState();
            const container = document.getElementById('myPostsListContainer');
            const currentUser = Layout.getCurrentUser();
            const role = Layout.getDemoRole();

            // 1. Loading
            if (state === 'loading') {
                container.innerHTML = Array(3).fill(0).map(() => `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-5 space-y-3 animate-pulse">
                        <div class="w-2/3 h-5 bg-borderDark rounded"></div>
                        <div class="w-full h-10 bg-borderDark rounded"></div>
                    </div>
                `).join('');
                return;
            }

            // 2. Error
            if (state === 'error') {
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-rose-900/40 rounded-2xl p-8 text-center space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-3xl"></i>
                        <h3 class="text-sm font-bold text-white">Lỗi kết nối dữ liệu bài viết</h3>
                        <p class="text-xs text-gray-400">Không thể tải danh sách bài viết của bạn. Vui lòng thử lại.</p>
                        <button onclick="Layout.setDemoState('normal')" class="bg-substackOrange text-white text-xs px-4 py-2 rounded-lg">Thử lại</button>
                    </div>
                `;
                return;
            }

            // Lấy danh sách bài của user này (hoặc tác giả Hoàng Anh nếu admin muốn xem)
            const authorId = currentUser ? currentUser.id : 3;
            let posts = MockData.posts.filter(p => (p.author_id === authorId || role === 'admin') && !p.deleted_at);

            // Cập nhật số đếm trên tab
            document.getElementById('count-all').textContent = posts.length;
            document.getElementById('count-published').textContent = posts.filter(p => p.status === 'published').length;
            document.getElementById('count-pending').textContent = posts.filter(p => p.status === 'pending').length;
            document.getElementById('count-draft').textContent = posts.filter(p => p.status === 'draft').length;
            document.getElementById('count-rejected').textContent = posts.filter(p => p.status === 'rejected').length;

            // 3. Demo Empty
            if (state === 'empty') posts = [];

            // Lọc theo tab hiện tại
            if (currentStatusFilter !== 'all') {
                posts = posts.filter(p => p.status === currentStatusFilter);
            }

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-10 text-center space-y-3">
                        <div class="w-12 h-12 bg-borderDark/60 text-gray-500 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-regular fa-newspaper"></i>
                        </div>
                        <h3 class="text-sm font-bold text-white">Chưa có bài viết nào ở mục này</h3>
                        <p class="text-xs text-gray-400 max-w-sm mx-auto">Bạn chưa có bài viết nào phù hợp với bộ lọc đã chọn.</p>
                        <a href="post-editor.html?new=true" class="inline-block mt-2 bg-substackOrange text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow">
                            Soạn bài viết mới
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => {
                const statusBadges = {
                    published: '<span class="px-2.5 py-1 bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 text-[10px] font-bold rounded-lg flex items-center space-x-1"><i class="fa-solid fa-circle-check"></i><span>ĐÃ ĐĂNG</span></span>',
                    pending: '<span class="px-2.5 py-1 bg-amber-950/60 border border-amber-500/40 text-amber-400 text-[10px] font-bold rounded-lg flex items-center space-x-1"><i class="fa-solid fa-clock"></i><span>CHỜ DUYỆT</span></span>',
                    draft: '<span class="px-2.5 py-1 bg-gray-800 border border-borderDark text-gray-300 text-[10px] font-bold rounded-lg flex items-center space-x-1"><i class="fa-regular fa-file-lines"></i><span>BẢN NHÁP</span></span>',
                    rejected: '<span class="px-2.5 py-1 bg-rose-950/60 border border-rose-500/40 text-rose-400 text-[10px] font-bold rounded-lg flex items-center space-x-1"><i class="fa-solid fa-ban"></i><span>BỊ TỪ CHỐI</span></span>'
                };

                return `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-4 sm:p-5 shadow-sm space-y-3 hover:border-gray-600 transition" id="post-row-${post.id}">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div class="flex items-center space-x-2">
                                ${statusBadges[post.status] || ''}
                                <span class="text-[11px] text-gray-500">Tạo ngày: ${Layout.formatDate(post.created_at)}</span>
                            </div>

                            <div class="flex items-center space-x-2 text-xs">
                                ${post.status === 'published' ? `
                                    <a href="post-detail.html?slug=${post.slug}" target="_blank" class="px-3 py-1.5 bg-cardBg hover:bg-borderDark text-gray-300 rounded-lg border border-borderDark" title="Xem trên web">
                                        <i class="fa-regular fa-eye mr-1"></i> Xem bài
                                    </a>
                                ` : ''}

                                <a href="post-editor.html?id=${post.id}" class="px-3 py-1.5 bg-cardBg hover:bg-borderDark text-gray-200 rounded-lg border border-borderDark font-medium" title="Chỉnh sửa bài viết">
                                    <i class="fa-regular fa-pen-to-square mr-1"></i> Sửa
                                </a>

                                <button onclick="deleteMyPost(${post.id})" class="px-3 py-1.5 bg-cardBg hover:bg-red-950/60 text-gray-400 hover:text-red-400 rounded-lg border border-borderDark transition" title="Xóa bài viết">
                                    <i class="fa-regular fa-trash-can mr-1"></i> Xóa
                                </button>
                            </div>
                        </div>

                        <!-- Tiêu đề & nội dung trích -->
                        <div>
                            <h2 class="text-base sm:text-lg font-bold text-white hover:text-substackOrange transition">
                                <a href="post-editor.html?id=${post.id}">${post.title}</a>
                            </h2>
                            <p class="text-xs text-gray-400 line-clamp-2 mt-1 leading-relaxed">
                                ${post.content.replace(/<[^>]*>?/gm, '')}
                            </p>
                        </div>

                        <!-- Banner hiển thị LÝ DO BỊ TỪ CHỐI (nếu có) + Nút Sửa và gửi lại -->
                        ${post.status === 'rejected' ? `
                            <div class="p-3.5 bg-rose-950/40 border border-rose-500/40 rounded-xl space-y-2 text-xs">
                                <div class="flex items-center space-x-2 font-bold text-rose-300">
                                    <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
                                    <span>Lý do Ban quản trị từ chối phê duyệt:</span>
                                </div>
                                <p class="text-gray-300 leading-relaxed italic">${post.reject_reason || 'Nội dung chưa đáp ứng tiêu chuẩn cộng đồng.'}</p>
                                <div class="pt-1">
                                    <a href="post-editor.html?id=${post.id}&resubmit=true" class="inline-flex items-center space-x-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs shadow transition">
                                        <i class="fa-solid fa-rotate-right"></i>
                                        <span>Sửa và gửi lại kiểm duyệt</span>
                                    </a>
                                </div>
                            </div>
                        ` : ''}

                        <div class="flex items-center justify-between text-[11px] text-gray-500 pt-1 border-t border-borderDark">
                            <span>Slug: <code class="text-gray-400">/${post.slug}</code></span>
                            ${post.status === 'published' ? `
                                <span><i class="fa-regular fa-eye mr-1"></i>${Layout.formatNumber(post.views_count)} lượt xem</span>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteMyPost(postId) {
            Layout.showConfirmModal({
                title: 'Xóa bài viết',
                message: 'Bạn có chắc chắn muốn xóa bài viết này không? Hành động này sẽ loại bỏ bài viết khỏi hệ thống.',
                confirmText: 'Xác nhận xóa',
                onConfirm: () => {
                    const post = MockData.posts.find(p => p.id === postId);
                    if (post) {
                        post.deleted_at = new Date().toISOString();
                    }
                    Layout.showToast('Đã xóa bài viết thành công!', 'success');
                    renderMyPosts();
                }
            });
        }
    </script>
</body>
</html>
