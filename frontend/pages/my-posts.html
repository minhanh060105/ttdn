<!-- my-posts.html -->
<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết của tôi | Substack Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        sidebarBg: '#181818',
                        cardBg: '#1e1e1e',
                        substackOrange: '#ff6719',
                        substackOrangeHover: '#e05b15',
                        borderDark: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-200 min-h-screen flex flex-col relative pb-16 md:pb-0">

    <header id="appHeader"></header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full px-2 sm:px-4">
        <aside id="appSidebar"></aside>

        <main class="flex-1 px-4 sm:px-8 py-6 max-w-5xl mx-auto w-full space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center space-x-2">
                        <i class="fa-solid fa-newspaper text-substackOrange"></i>
                        <span>Quản lý bài viết của tôi</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-1">Theo dõi trạng thái kiểm duyệt, chỉnh sửa bản nháp và xuất bản các bài viết.</p>
                </div>
                <a href="post-editor.html?new=true" class="bg-substackOrange hover:bg-substackOrangeHover text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow flex items-center space-x-2 self-start sm:self-auto">
                    <i class="fa-solid fa-plus"></i>
                    <span>Tạo bài viết mới</span>
                </a>
            </div>

            <!-- Tab lọc trạng thái -->
            <div class="flex space-x-2 border-b border-borderDark pb-2 overflow-x-auto text-xs font-semibold">
                <button onclick="filterStatus('all')" id="tab-all" class="px-3.5 py-2 rounded-xl bg-substackOrange text-white transition">
                    Tất cả (<span id="count-all">0</span>)
                </button>
                <button onclick="filterStatus('published')" id="tab-published" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Đã đăng (<span id="count-published">0</span>)
                </button>
                <button onclick="filterStatus('pending')" id="tab-pending" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Chờ duyệt (<span id="count-pending">0</span>)
                </button>
                <button onclick="filterStatus('draft')" id="tab-draft" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Bản nháp (<span id="count-draft">0</span>)
                </button>
                <button onclick="filterStatus('rejected')" id="tab-rejected" class="px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition">
                    Bị từ chối (<span id="count-rejected">0</span>)
                </button>
            </div>

            <!-- Danh sách bài viết -->
            <div id="myPostsListContainer" class="space-y-4"></div>

            <!-- Thanh phân trang luôn hiển thị -->
            <div id="myPostsPagination" class="pt-6 border-t border-borderDark flex items-center justify-between text-xs text-gray-400">
                <button id="prevBtn" onclick="changePage(-1)" class="px-3.5 py-2 rounded-xl bg-cardBg border border-borderDark hover:bg-borderDark text-white transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1.5">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Trang trước</span>
                </button>
                <span id="pageInfoText" class="font-medium">Trang 1 / 1</span>
                <button id="nextBtn" onclick="changePage(1)" class="px-3.5 py-2 rounded-xl bg-cardBg border border-borderDark hover:bg-borderDark text-white transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1.5">
                    <span>Trang sau</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </main>
    </div>

    <nav id="appBottomNav"></nav>

    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/layout.js"></script>

    <script>
        let currentStatusFilter = 'all';
        let currentPage = 1;
        const POSTS_PER_PAGE = 3;

        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderHeader('appHeader');
            Layout.renderSidebar('my-posts', 'appSidebar');
            Layout.renderBottomNav('', 'appBottomNav');
            renderMyPosts();

            window.addEventListener('demoStateChanged', () => {
                renderMyPosts();
            });
        });

        function filterStatus(status) {
            currentStatusFilter = status;
            currentPage = 1;
            ['all', 'published', 'pending', 'draft', 'rejected'].forEach(s => {
                const btn = document.getElementById(`tab-${s}`);
                if (btn) {
                    btn.className = s === status 
                        ? "px-3.5 py-2 rounded-xl bg-substackOrange text-white transition font-semibold"
                        : "px-3.5 py-2 rounded-xl text-gray-400 hover:text-white transition font-medium";
                }
            });
            renderMyPosts();
        }

        function renderMyPosts() {
            const state = Layout.getDemoState();
            const container = document.getElementById('myPostsListContainer');
            const currentUser = Layout.getCurrentUser();
            const role = Layout.getDemoRole();

            if (state === 'loading') {
                container.innerHTML = Array(3).fill(0).map(() => `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-5 space-y-3 animate-pulse">
                        <div class="w-2/3 h-5 bg-borderDark rounded"></div>
                        <div class="w-full h-10 bg-borderDark rounded"></div>
                    </div>
                `).join('');
                return;
            }

            const authorId = currentUser ? currentUser.id : 3;
            let posts = MockData.posts.filter(p => (p.author_id === authorId || role === 'admin') && !p.deleted_at);

            document.getElementById('count-all').textContent = posts.length;
            document.getElementById('count-published').textContent = posts.filter(p => p.status === 'published').length;
            document.getElementById('count-pending').textContent = posts.filter(p => p.status === 'pending').length;
            document.getElementById('count-draft').textContent = posts.filter(p => p.status === 'draft').length;
            document.getElementById('count-rejected').textContent = posts.filter(p => p.status === 'rejected').length;

            if (state === 'empty') posts = [];

            if (currentStatusFilter !== 'all') {
                posts = posts.filter(p => p.status === currentStatusFilter);
            }

            // Tính phân trang
            const totalPages = Math.ceil(posts.length / POSTS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            // Luôn cập nhật thanh pagination hiển thị ra giao diện
            document.getElementById('pageInfoText').textContent = `Trang ${currentPage} / ${totalPages} (${posts.length} bài viết)`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages || posts.length === 0);

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-10 text-center space-y-3">
                        <i class="fa-regular fa-newspaper text-3xl text-gray-500"></i>
                        <h3 class="text-sm font-bold text-white">Chưa có bài viết nào ở mục này</h3>
                    </div>
                `;
                return;
            }

            const startIndex = (currentPage - 1) * POSTS_PER_PAGE;
            const paginatedPosts = posts.slice(startIndex, startIndex + POSTS_PER_PAGE);

            container.innerHTML = paginatedPosts.map(post => {
                const statusBadges = {
                    published: '<span class="px-2.5 py-1 bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 text-[10px] font-bold rounded-lg"><i class="fa-solid fa-circle-check mr-1"></i>ĐÃ ĐĂNG</span>',
                    pending: '<span class="px-2.5 py-1 bg-amber-950/60 border border-amber-500/40 text-amber-400 text-[10px] font-bold rounded-lg"><i class="fa-solid fa-clock mr-1"></i>CHỜ DUYỆT</span>',
                    draft: '<span class="px-2.5 py-1 bg-gray-800 border border-borderDark text-gray-300 text-[10px] font-bold rounded-lg"><i class="fa-regular fa-file-lines mr-1"></i>BẢN NHÁP</span>',
                    rejected: '<span class="px-2.5 py-1 bg-rose-950/60 border border-rose-500/40 text-rose-400 text-[10px] font-bold rounded-lg"><i class="fa-solid fa-ban mr-1"></i>BỊ TỪ CHỐI</span>'
                };

                return `
                    <div class="bg-sidebarBg border border-borderDark rounded-2xl p-4 sm:p-5 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                ${statusBadges[post.status] || ''}
                                <span class="text-[11px] text-gray-500">Tạo ngày: ${Layout.formatDate(post.created_at)}</span>
                            </div>
                            <div class="flex items-center space-x-2 text-xs">
                                <a href="post-editor.html?id=${post.id}" class="px-3 py-1.5 bg-cardBg hover:bg-borderDark text-gray-200 rounded-lg border border-borderDark">
                                    <i class="fa-regular fa-pen-to-square mr-1"></i> Sửa
                                </a>
                                <button onclick="deleteMyPost(${post.id})" class="px-3 py-1.5 bg-cardBg hover:bg-red-950/60 text-gray-400 hover:text-red-400 rounded-lg border border-borderDark">
                                    <i class="fa-regular fa-trash-can mr-1"></i> Xóa
                                </button>
                            </div>
                        </div>
                        <h2 class="text-base sm:text-lg font-bold text-white hover:text-substackOrange transition">
                            <a href="post-editor.html?id=${post.id}">${post.title}</a>
                        </h2>
                        <p class="text-xs text-gray-400 line-clamp-2">${post.content.replace(/<[^>]*>?/gm, '')}</p>
                    </div>
                `;
            }).join('');
        }

        function changePage(delta) {
            currentPage += delta;
            renderMyPosts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteMyPost(postId) {
            Layout.showConfirmModal({
                title: 'Xóa bài viết',
                message: 'Bạn có chắc chắn muốn xóa bài viết này không?',
                confirmText: 'Xác nhận xóa',
                onConfirm: () => {
                    const post = MockData.posts.find(p => p.id === postId);
                    if (post) post.deleted_at = new Date().toISOString();
                    Layout.showToast('Đã xóa bài viết thành công!', 'success');
                    renderMyPosts();
                }
            });
        }
    </script>
</body>
</html>
